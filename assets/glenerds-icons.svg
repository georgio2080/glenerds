<!-- ==========================================================================
     GLENERDS ICON SET v1.0 — inline SVG <symbol> sprite
     --------------------------------------------------------------------------
     Inline this whole file right after <body> in each app (or paste the
     <svg> block). Zero external requests. See INTEGRATION.md for usage.

     - 24x24 grid, stroke-based line icons, stroke-width 2, round caps/joins.
     - Clean variant inherits text color (currentColor).
     - Flash variant: add class "g-icon-flash" to the <svg> wrapper and the
       stroke renders in the brand indigo gradient instead.
     - All geometry inherits from the symbol; do not set stroke/fill on <use>.
     ========================================================================== -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-grad-indigo" gradientUnits="userSpaceOnUse" x1="6" y1="4" x2="18" y2="20">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="g-grad-sunset" gradientUnits="userSpaceOnUse" x1="6" y1="4" x2="18" y2="20">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="g-grad-ocean" gradientUnits="userSpaceOnUse" x1="6" y1="4" x2="18" y2="20">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="g-grad-royal" gradientUnits="userSpaceOnUse" x1="6" y1="4" x2="18" y2="20">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- calculator -->
  <symbol id="g-i-calc" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6.5" y="3" width="11" height="18" rx="2"/>
    <path d="M9.5 7.5h5"/>
    <path d="M9.5 12h.02M12 12h.02M14.5 12h.02M9.5 15.5h.02M12 15.5h.02M14.5 15.5h.02"/>
  </symbol>

  <!-- chart / graph (bars) -->
  <symbol id="g-i-chart" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h16"/>
    <path d="M7.5 20v-6.5M12 20V6.5M16.5 20v-9.5"/>
  </symbol>

  <!-- calendar -->
  <symbol id="g-i-cal" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/>
    <path d="M8 3v3.5M16 3v3.5M3.5 10h17"/>
