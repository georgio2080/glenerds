    <circle cx="8" cy="8" r="1.4"/>
  </symbol>

  <!-- search -->
  <symbol id="g-i-search" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="6.5"/>
    <path d="M15.8 15.8l4.7 4.7"/>
  </symbol>

  <!-- edit pencil -->
  <symbol id="g-i-edit" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20l1.2-4.2L16.7 4.3a2 2 0 012.9 2.9L8.1 18.7 4 20z"/>
