<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free offline home renovation budget tracker: set category budgets, log expenses, compare contractor quotes, and manage change orders with a contingency buffer. No account, no subscription — your data never leaves this device.">

<title>Free Home Renovation Budget Tracker: Remodel Cost Planner & Quote Comparison (RenoTrack)</title>
<style>
:root{
  --bg:#f4f6f9; --bg2:#eef1f5; --card:#ffffff; --ink:#1c2430; --ink2:#5b6b7d;
  --line:#dde4ec; --accent:#0f7b6c; --accent-d:#0a5f53; --accent-soft:#e0f2ee;
  --warn:#b45309; --warn-soft:#fef3e2; --danger:#c2410c; --danger-soft:#fdeee6;
  --ok:#15803d; --ok-soft:#e7f6ec; --bar:#cbd5e1; --radius:12px;
  --shadow:0 1px 3px rgba(20,35,55,.08),0 4px 14px rgba(20,35,55,.06);
}
html[data-theme="dark"]{
  --bg:#12161c; --bg2:#171c24; --card:#1c222c; --ink:#e8edf3; --ink2:#9aa7b8;
  --line:#2b3442; --accent:#2dd4a7; --accent-d:#7ce8c8; --accent-soft:#14332c;
  --warn:#f59e0b; --warn-soft:#33260e; --danger:#f87171; --danger-soft:#3a1d16;
  --ok:#4ade80; --ok-soft:#12301f; --bar:#334052;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top-in{max-width:1060px;margin:0 auto;padding:10px 16px;display:flex;
  align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;
  letter-spacing:.2px}
.logo svg{width:30px;height:30px}
.tagline{font-size:12px;color:var(--ink2);margin-top:2px}
.spacer{flex:1}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--ink);border-radius:9px;padding:8px 14px;
  display:inline-flex;align-items:center;gap:7px}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);
  color:#fff;font-weight:600}
html[data-theme="dark"] button.primary,html[data-theme="dark"] .btn.primary{color:#06231d}
button.primary:hover{background:var(--accent-d)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.small{padding:5px 10px;font-size:13px;border-radius:7px}
button.icon{padding:6px;border-radius:8px;line-height:0}
svg.ic{width:16px;height:16px;flex:none}
/* Glenerds standard cluster: More Apps, flask, dark-mode, sound — circular 44x44 icon-only */
.g-header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.g-round-btn{flex:0 0 auto;width:44px;height:44px;min-width:44px;min-height:44px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);color:var(--ink);
  border-radius:999px;cursor:pointer;font-size:1.1rem;box-shadow:var(--shadow);
  transition:border-color .18s ease, transform .18s ease}
.g-round-btn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.g-round-btn:hover{border-color:var(--accent)}
.g-round-btn:active{transform:scale(0.97)}
.g-round-btn:focus{outline:none}
.g-round-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.g-round-btn.sample-toggle[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);
  background:color-mix(in srgb, var(--accent) 12%, var(--card))}
@media(max-width:480px){.g-header-actions{gap:6px}}
main{max-width:1060px;margin:0 auto;padding:18px 16px 60px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type="number"]{text-align:right}
label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);
  margin:0 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px}
.card h2{margin:0 0 12px;font-size:17px}
.card h3{margin:14px 0 8px;font-size:15px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px}
.stat .k{font-size:12px;color:var(--ink2);font-weight:600;text-transform:uppercase;

.stat .v{font-size:22px;font-weight:800;margin-top:3px}
.stat .v small{font-size:13px;font-weight:600;color:var(--ink2)}
.v-ok{color:var(--ok)} .v-warn{color:var(--warn)} .v-bad{color:var(--danger)}
.bar{height:10px;border-radius:6px;background:var(--bar);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--accent);
  transition:width .3s}
.bar>i.over{background:var(--danger)}
.bar>i.near{background:var(--warn)}
.rowline{display:flex;align-items:center;gap:10px;padding:10px 0;

.rowline:last-child{border-bottom:0}
.catname{font-weight:600}
.sub{font-size:13px;color:var(--ink2)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.over-tag{font-size:11px;font-weight:700;color:#fff;background:var(--danger);

.near-tag{font-size:11px;font-weight:700;color:#fff;background:var(--warn);
  border-radius:6px;padding:2px 7px;text-transform:uppercase;letter-spacing:.4px}
nav.tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}
nav.tabs button{border-radius:999px;padding:8px 16px;font-weight:600;

nav.tabs button.active{background:var(--accent-soft);color:var(--accent-d);

html[data-theme="dark"] nav.tabs button.active{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);

td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.over td{background:var(--danger-soft)}
td.num,th.num{text-align:right}
.empty{padding:26px;text-align:center;color:var(--ink2);font-size:14px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);

dialog::backdrop{background:rgba(10,18,28,.5)}
.dlg-in{padding:20px}

.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.field{margin-bottom:12px}
.quote-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.bid{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg2)}
.bid.accepted{border:2px solid var(--accent);background:var(--accent-soft)}
.bid .who{font-weight:700}
.bid .amt{font-size:20px;font-weight:800;margin:4px 0}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;

.b-proposed{background:var(--warn-soft);color:var(--warn)}
.b-approved{background:var(--ok-soft);color:var(--ok)}
.b-rejected{background:var(--danger-soft);color:var(--danger)}
.pill{font-size:12px;background:var(--accent-soft);color:var(--accent-d);

html[data-theme="dark"] .pill{color:var(--accent)}
.alert{border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px;

.alert.warn{background:var(--warn-soft);border:1px solid var(--warn);color:inherit}
.alert.bad{background:var(--danger-soft);border:1px solid var(--danger);color:inherit}
.alert.ok{background:var(--ok-soft);border:1px solid var(--ok);color:inherit}
footer{border-top:1px solid var(--line);padding:18px 16px 30px;text-align:center;

footer a{color:var(--accent);text-decoration:none;font-weight:600}
.projbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.projbar select{width:auto;min-width:200px;font-weight:700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.right{margin-left:auto}
.muted{color:var(--ink2);font-size:13px}
.neg{color:var(--danger)} .pos{color:var(--ok)}
.q-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
@media (max-width:700px){

  .top-in{padding:8px 12px}

  table.resp tr{display:block;border:1px solid var(--line);border-radius:10px;

  table.resp td::before{content:none}
  :root{--card:#fff;--ink:#111;--ink2:#555;--line:#ccc;--bg:#fff;--bg2:#f5f5f5;
    --bar:#ddd;--accent:#0f7b6c;--accent-d:#0a5f53;--accent-soft:#e0f2ee}
}

.g-store-btn {

<script>
"use strict";
/* ============ RenoTrack core ============ */
const LS_KEY = "renotrack-v1";
const CATEGORIES_PRESET = ["Demolition","Structural","Plumbing","Electrical","Kitchen",
  "Bathrooms","Flooring","Paint & Drywall","Fixtures & Finishes","Appliances",
  "Permits & Fees","Labor","Contingency"];
const CONTINGENCY_NAME = "Contingency";

/* ---------- money: exact cents ---------- */
/* ---------- money: exact cents (string-parsed, no float drift) ---------- */
function toCents(v){
  if(v===null||v===undefined) return 0;
  let s=String(v).trim().replace(/[$,\s]/g,"");
  if(s==="") return 0;
  let neg=false;
  if(s[0]==="-"){ neg=true; s=s.slice(1); }
  else if(s[0]==="+"){ s=s.slice(1); }
  if(!/^\d*(\.\d*)?$/.test(s)) return 0;
  const parts=s.split(".");
  const dollars=parts[0]===""?0:parseInt(parts[0],10);
  let frac=(parts[1]||"").replace(/\D/g,"");
  while(frac.length<3) frac+="0";          // keep 3rd decimal for rounding
  let cents=dollars*100+parseInt(frac.slice(0,2),10);
  if(parseInt(frac[2],10)>=5) cents+=1;    // round half up
  return neg?-cents:cents;
}
function fmt(cents){
  const neg = cents<0, a = Math.abs(Math.round(cents));
  return (neg?"-$":"$") + Math.floor(a/100).toLocaleString("en-US") +
    "." + String(a%100).padStart(2,"0");
}
function fmtSigned(cents){ return (cents<0?"-":"+") + fmt(Math.abs(cents)); }
function pct(part,whole){
  part=Number(part); whole=Number(whole);
  if(!isFinite(part)) part=0;
  if(!isFinite(whole)||whole<=0) return part>0?100:0;
  return (part/whole)*100;
}
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }

/* ---------- state ---------- */
let S = null;           // whole app state
let activeTab = "dashboard";
let coFilter = "all";   // change-order status filter

function blankState(){ return {version:1, theme:null, activeProjectId:null, projects:[]}; }
function blankProject(name){
  return { id:uid(), name:name||"New project", createdAt:Date.now(),
    contingencyPct:10,
    categories: CATEGORIES_PRESET.map(n=>({id:uid(), name:n, budgetCents: n===CONTINGENCY_NAME?0:0})),
    expenses: [], quotes: [], changeOrders: [] };
}
let quotaWarned=false;
function save(){
  if(sampleOn) return; /* sample data is transient — never persisted */
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){
    if(!quotaWarned && e && e.name==="QuotaExceededError"){
      quotaWarned=true;
      dlgAlert("Browser storage is full — changes are NOT being saved. Export your data now so you don't lose work.");
    }
  }
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || typeof s!=="object" || !Array.isArray(s.projects)) return null;
    return s;
  }catch(e){ return null; }
}
function P(){ return S.projects.find(p=>p.id===S.activeProjectId) || null; }
function catById(p,id){ return p.categories.find(c=>c.id===id) || null; }
function catName(p,id){ const c=catById(p,id); return c?c.name:"—"; }
function isContingencyCat(p,id){ const c=catById(p,id); return !!c && c.name===CONTINGENCY_NAME; }

/* ---------- math (all in cents) ---------- */
function catExpensesCents(p,catId){
  return p.expenses.filter(e=>e.categoryId===catId).reduce((t,e)=>t+e.cents,0);
}
function catChangeCents(p,catId){ // approved change-order deltas in this category
  return p.changeOrders.filter(c=>c.categoryId===catId && c.status==="approved")
    .reduce((t,c)=>t+c.deltaCents,0);
}
function catActualCents(p,catId){ return catExpensesCents(p,catId)+catChangeCents(p,catId); }
function baseBudgetCents(p){ // sum of non-contingency category budgets
  return p.categories.filter(c=>c.name!==CONTINGENCY_NAME)
    .reduce((t,c)=>t+c.budgetCents,0);
}
function contingencyAllocCents(p){ return Math.round(baseBudgetCents(p)*p.contingencyPct/100); }
function totalBudgetCents(p){ return baseBudgetCents(p)+contingencyAllocCents(p); }
function actualSpentCents(p){ // everything actually spent incl. approved change orders
  const e = p.expenses.reduce((t,x)=>t+x.cents,0);
  const c = p.changeOrders.filter(x=>x.status==="approved").reduce((t,x)=>t+x.deltaCents,0);
  return e+c;
}
function acceptedQuotesCents(p){
  return p.quotes.reduce((t,q)=>t+q.bids.filter(b=>b.accepted).reduce((a,b)=>a+b.cents,0),0);
}
function committedCents(p){ return actualSpentCents(p)+acceptedQuotesCents(p); }
function remainingCents(p){ return totalBudgetCents(p)-committedCents(p); }
function contingencyConsumedCents(p){ // NET approved change-order cost draws on contingency
  return p.changeOrders.filter(x=>x.status==="approved").reduce((t,x)=>t+x.deltaCents,0);
}
function contingencyRemainingCents(p){ return contingencyAllocCents(p)-contingencyConsumedCents(p); }

/* ---------- theme ---------- */
function paintTheme(){
  const dark = document.documentElement.getAttribute("data-theme")==="dark";
  const b = document.getElementById("themeToggle"); if(!b) return;
  b.innerHTML = dark
    ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  const l = dark ? "Switch to light mode" : "Switch to dark mode";
  b.setAttribute("aria-pressed", dark?"true":"false");
  b.setAttribute("aria-label", l); b.title = l;
}
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  paintTheme();
  if(S){ S.theme=t; save(); }
}
function initTheme(){
  let t = S && S.theme ? S.theme :
    (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light");
  document.documentElement.setAttribute("data-theme", t);
  paintTheme();
  if(S && !S.theme){ S.theme=t; }
}

/* ---------- sample data toggle (transient: snapshot user data, never persisted) ---------- */
let sampleOn = false, sampleSnap = null;
function paintSample(){
  const b = document.getElementById("sampleToggle"); if(!b) return;
  const l = sampleOn ? "Clear sample data" : "Try sample data";
  b.setAttribute("aria-pressed", sampleOn?"true":"false");
  b.setAttribute("aria-label", l); b.title = l;
}
function fillSample(){
  S = blankState();
  seedDemo();
  activeTab = "dashboard";
  renderProjectSel(); renderTabs(); render();
}
function setSample(on){
  if(on && !sampleOn){
    sampleSnap = { json: JSON.stringify(S), activeTab };
    sampleOn = true;
    fillSample();
  } else if(!on && sampleOn){
    sampleOn = false;
    const snap = sampleSnap; sampleSnap = null;
    if(snap){
      S = JSON.parse(snap.json);
      activeTab = snap.activeTab || "dashboard";
    }
    /* repaint theme from the restored state (sample-off reverts any theme toggle made while sampling) */
    document.documentElement.setAttribute("data-theme", (S && S.theme) || "light");
    paintTheme();
    renderProjectSel(); renderTabs(); render();
  }
  paintSample();
}

/* ---------- subtle sounds (Web Audio oscillator, no files, offline) ---------- */
var Sound = (function(){
  const K = "renotrack.sound"; let on = true, ctx = null;
  try { if(window.localStorage.getItem(K)==="off") on=false; } catch(e){}
  function ac(){ try {
    if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; ctx = new AC(); }
    return ctx; } catch(e){ return null; } }
  function tone(freq, dur, type, vol, delay){
    const c = ac(); if(!c) return;
    function play(){ try {
      const t = c.currentTime + (delay||0), o = c.createOscillator(), g = c.createGain();
      o.type = type||"sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol||0.06, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.05); } catch(e){} }
    if(c.state==="suspended"){ c.resume().then(play, play); } else { play(); }
  }
  return {
    isOn(){ return on; },
    toggle(){ on=!on; try{ window.localStorage.setItem(K, on?"on":"off"); }catch(e){} return on; },
    click(){ if(on) tone(520,0.06,"sine",0.045); },
    select(){ if(on){ tone(660,0.07,"sine",0.055); tone(880,0.09,"sine",0.045,0.06); } },
    success(){ if(on){ tone(660,0.09,"sine",0.06); tone(990,0.12,"sine",0.05,0.08); } },
    error(){ if(on) tone(170,0.16,"sawtooth",0.045); },
    toggleTheme(){ if(on) tone(440,0.06,"triangle",0.05); }
  };
})();
function paintSoundBtn(btn){
  const on = Sound.isOn();
  btn.innerHTML = on ? "&#128266;" : "&#128263;";
  btn.setAttribute("aria-pressed", on?"true":"false");
  btn.setAttribute("aria-label", "Sound: "+(on?"on":"off"));
  btn.title = "Toggle sounds ("+(on?"on":"off")+")";
}
function toggleSound(btn){
  Sound.toggle();
  paintSoundBtn(btn);
  Sound.click();
}

/* ---------- dialogs ---------- */
function openDlg(html){ const b=document.getElementById("dlgBody"); b.innerHTML=html; document.getElementById("dlg").showModal(); }
function closeDlg(){ document.getElementById("dlg").close(); }
function dlgAlert(msg){
  openDlg(`<h2>Heads up</h2><p>${msg}</p>
    <div class="dlg-actions"><button class="primary" onclick="closeDlg()">OK</button></div>`);
}
function dlgConfirm(msg,onYes){
  window._dlgYes=onYes;
  openDlg(`<h2>Confirm</h2><p>${msg}</p>
    <div class="dlg-actions"><button onclick="closeDlg()">Cancel</button>
    <button class="primary" onclick="closeDlg();window._dlgYes()">Delete</button></div>`);
}
// fields: [{k,lbl,type,val,req,step,opts,min,max,ph,ta}]
function dlgForm(title,fields,onSave,opts){
  opts=opts||{};
  const body=fields.map(f=>{
    let input="";
    if(f.type==="select"){
      input=`<select id="f_${f.k}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.val)?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
    }else if(f.ta){
      input=`<textarea id="f_${f.k}" rows="3" placeholder="${esc(f.ph||"")}">${esc(f.val??"")}</textarea>`;
    }else{
      input=`<input id="f_${f.k}" type="${f.type||"text"}" value="${esc(f.val??"")}"
        ${f.req?"required":""} ${f.min!==undefined?`min="${f.min}"`:""} ${f.max!==undefined?`max="${f.max}"`:""}
        ${f.step?`step="${f.step}"`:""} placeholder="${esc(f.ph||"")}">`;
    }
    return `<div class="field"><label class="lbl" for="f_${f.k}">${f.lbl}</label>${input}</div>`;
  }).join("");
  window._dlgSave=onSave;
  openDlg(`<h2>${esc(title)}</h2><form id="dlgFormEl">${body}
    ${opts.note?`<p class="muted">${opts.note}</p>`:""}
    <div class="dlg-actions"><button type="button" onclick="closeDlg()">Cancel</button>
    <button type="submit" class="primary">${esc(opts.saveLabel||"Save")}</button></div></form>`);
  document.getElementById("dlgFormEl").onsubmit=e=>{
    e.preventDefault();
    const vals={};
    for(const f of fields){ const el=document.getElementById("f_"+f.k); vals[f.k]=el.value; }
    if(fields.some(f=>f.req && !String(vals[f.k]).trim())) return;
    closeDlg(); window._dlgSave(vals);
  };
}

/* ---------- dashboard ---------- */
function barHTML(actual,budget){
  const p=pct(actual,budget);
  const cls=actual>budget?"over":(p>=90?"near":"");
  const tag=actual>budget?`<span class="over-tag">Over</span>`:(p>=90?`<span class="near-tag">Near</span>`:"");
  return `<div class="bar"><i class="${cls}" style="width:${Math.min(100,p)}%"></i></div>
    <div style="margin-top:5px">${tag}</div>`;
}
function renderDashboard(p){
  const tb=totalBudgetCents(p), act=actualSpentCents(p), com=committedCents(p),
        rem=remainingCents(p), usedPct=pct(com,tb);
  const coAlloc=contingencyAllocCents(p), coUsed=contingencyConsumedCents(p),
        coRem=contingencyRemainingCents(p);
  const coPct=coAlloc>0?pct(coUsed,coAlloc):0;
  let coAlert="";
  if(coAlloc>0 && coRem<0){
    coAlert=`<div class="alert bad"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
      <div><b>Contingency exceeded.</b> Approved change orders total <b class="money">${fmt(coUsed)}</b> against a <b class="money">${fmt(coAlloc)}</b> contingency — you are <b class="money neg">${fmt(-coRem)}</b> over.</div></div>`;
  }else if(coAlloc>0 && coPct>=75){
    coAlert=`<div class="alert warn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <div><b>Contingency running low.</b> ${Math.round(coPct)}% of your <b class="money">${fmt(coAlloc)}</b> contingency is committed to approved change orders (<b class="money">${fmt(coRem)}</b> left).</div></div>`;
  }
  const cats=p.categories.map(c=>{
    const a=catActualCents(p,c.id);
    const isCont=c.name===CONTINGENCY_NAME;
    const b=isCont?coAlloc:c.budgetCents;
    const pctv=b>0?Math.round(pct(a,b)):0;
    return `<div class="rowline"><div style="flex:1;min-width:0">
      <div class="catname">${esc(c.name)}</div>
      <div class="sub"><span class="money">${fmt(a)}</span> of <span class="money">${fmt(b)}</span>${isCont?' <span class="pill">auto</span>':""} · ${pctv}%</div>
      ${barHTML(a,b)}</div>
      <div class="sub money" style="min-width:86px;text-align:right">${fmt(b-a)} left</div></div>`;
  }).join("");
  const recent=[...p.expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  const recentHTML=recent.length?`<table><thead><tr><th>Date</th><th>Category</th><th>Payee</th><th class="num">Amount</th></tr></thead><tbody>${
    recent.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(catName(p,e.categoryId))}</td><td>${esc(e.vendor||"—")}</td><td class="num money">${fmt(e.cents)}</td></tr>`).join("")
  }</tbody></table>`:`<div class="empty">No expenses yet — add them under Budget &amp; Expenses.</div>`;
  return `
  ${coAlert}
  <div class="grid4" style="margin-bottom:14px">
    <div class="stat"><div class="k">Total budget</div><div class="v money">${fmt(tb)}</div>
      <div class="sub">base ${fmt(baseBudgetCents(p))} + contingency ${fmt(coAlloc)}</div></div>
    <div class="stat"><div class="k">Spent (actual)</div><div class="v money">${fmt(act)}</div>
      <div class="sub">accepted quotes add <span class="money">${fmt(acceptedQuotesCents(p))}</span></div></div>
    <div class="stat"><div class="k">Committed</div><div class="v money">${fmt(com)}</div>
      <div class="sub">${usedPct.toFixed(1)}% of budget used</div>
      <div class="bar"><i class="${com>tb?"over":(usedPct>=90?"near":"")}" style="width:${Math.min(100,usedPct)}%"></i></div></div>
    <div class="stat"><div class="k">Remaining</div><div class="v money ${rem<0?"v-bad":"v-ok"}">${fmt(rem)}</div>
      <div class="sub">contingency left: <span class="money ${coRem<0?"neg":""}">${fmt(coRem)}</span></div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Budget by category</h2>${cats}</div>
    <div class="card"><h2>Recent expenses</h2>${recentHTML}
      <div class="toolbar no-print"><button class="small primary" onclick="expenseForm()">+ Add expense</button></div></div>
  </div>`;
}

/* ---------- budget & expenses ---------- */
function categoryForm(editId){
  const p=P(); if(!p) return;
  const c=editId?catById(p,editId):null;
  dlgForm(c?"Rename category":"Add category",[
    {k:"name",lbl:"Category name",val:c?c.name:"",req:true}
  ],(vals)=>{
    const name=vals.name.trim(); if(!name) return;
    if(p.categories.some(x=>x.id!==editId&&x.name.toLowerCase()===name.toLowerCase())){
      dlgAlert("A category with that name already exists."); return;
    }
    if(c){ c.name=name; } else { p.categories.push({id:uid(),name,budgetCents:0}); }
    save(); render();
  });
}
function deleteCategory(id){
  const p=P(); if(!p) return;
  const c=catById(p,id); if(!c) return;
  if(p.categories.length<=1){ dlgAlert("You need at least one category."); return; }
  const used=p.expenses.some(e=>e.categoryId===id)||p.quotes.some(q=>q.categoryId===id)||
             p.changeOrders.some(x=>x.categoryId===id);
  if(used){ dlgAlert("This category has expenses, quotes or change orders on it — move or delete those first."); return; }
  dlgConfirm(`Delete the "${esc(c.name)}" category?`,()=>{ p.categories=p.categories.filter(x=>x.id!==id); save(); render(); });
}
function expenseForm(editId){
  const p=P(); if(!p) return;
  const e=editId?p.expenses.find(x=>x.id===editId):null;
  const nonCont=p.categories.filter(c=>c.name!==CONTINGENCY_NAME);
  const opts=nonCont.map(c=>[c.id,c.name]);
  if(!opts.length){ dlgAlert("Add a category first."); return; }
  dlgForm(e?"Edit expense":"Add expense",[
    {k:"date",lbl:"Date",type:"date",val:e?e.date:todayStr(),req:true},
    {k:"categoryId",lbl:"Category",type:"select",val:e?e.categoryId:opts[0][0],opts},
    {k:"vendor",lbl:"Vendor / payee",val:e?e.vendor:"",ph:"Home Depot, ABC Plumbing…"},
    {k:"amount",lbl:"Amount ($)",type:"number",step:"0.01",min:"0",val:e?(e.cents/100).toFixed(2):"",req:true,ph:"0.00"},
    {k:"note",lbl:"Note",ta:true,val:e?e.note:"",ph:"What was this for?"}
  ],(vals)=>{
    const cents=toCents(vals.amount);
    if(cents<=0){ dlgAlert("Enter an amount greater than $0."); return; }
    if(e){ Object.assign(e,{date:vals.date,categoryId:vals.categoryId,vendor:vals.vendor.trim(),cents,note:vals.note.trim()}); }
    else{ p.expenses.push({id:uid(),date:vals.date,categoryId:vals.categoryId,vendor:vals.vendor.trim(),cents,note:vals.note.trim()}); }

  },{saveLabel:e?"Save":"Add expense"});

function deleteExpense(id){

  dlgConfirm(`Delete this ${fmt(e.cents)} expense${e.vendor?` to ${esc(e.vendor)}`:""}?`,

    const a=catActualCents(p,c.id);

    const over=a>b;

      <td data-l="Category"><b>${esc(c.name)}</b>${isCont?' <span class="pill">auto</span>':""}</td>

      <td data-l="Actual" class="num money">${fmt(a)}</td>
      <td data-l="Left" class="num money ${over?"neg":""}">${fmt(b-a)}</td>

    ${p.expenses.length?`<div style="overflow-x:auto"><table class="resp"><thead><tr><th>Date</th><th>Category</th><th>Payee</th><th>Note</th><th class="num">Amount</th><th class="no-print">Actions</th></tr></thead>

function deleteQuote(id){

    ()=>{ p.quotes=p.quotes.filter(x=>x.id!==id); save(); render(); });
}
function bidForm(quoteId,editIdx){
  const p=P(); if(!p) return;
  const q=p.quotes.find(x=>x.id===quoteId); if(!q) return;
  const b=editIdx!==undefined?q.bids[editIdx]:null;
  if(!b && q.bids.length>=4){ dlgAlert("Only 4 quotes per job — remove one first."); return; }
  dlgForm(b?"Edit bid":"Add bid",[
    {k:"contractor",lbl:"Contractor name",val:b?b.contractor:"",req:true,ph:"ABC Plumbing Co."},
    {k:"amount",lbl:"Quoted amount ($)",type:"number",step:"0.01",min:"0",val:b?(b.cents/100).toFixed(2):"",req:true,ph:"0.00"},
    {k:"notes",lbl:"Notes",ta:true,val:b?b.notes:"",ph:"Timeline, what's included…"}
  ],(vals)=>{
    const cents=toCents(vals.amount);
    if(cents<=0){ dlgAlert("Enter an amount greater than $0."); return; }
    const nb={contractor:vals.contractor.trim(),cents,notes:vals.notes.trim(),accepted:b?b.accepted:false};
    if(b){ q.bids[editIdx]=nb; } else { q.bids.push(nb); }
    save(); render();
  },{saveLabel:b?"Save":"Add bid"});

function deleteBid(quoteId,idx){
  const p=P(); const q=p.quotes.find(x=>x.id===quoteId); if(!q||!q.bids[idx]) return;
  dlgConfirm(`Remove the ${fmt(q.bids[idx].cents)} bid from ${esc(q.bids[idx].contractor)}?`,
    ()=>{ q.bids.splice(idx,1); save(); render(); });
}
function acceptBid(quoteId,idx){
  const p=P(); const q=p.quotes.find(x=>x.id===quoteId); if(!q||!q.bids[idx]) return;
  q.bids.forEach((b,i)=>{ b.accepted = (i===idx) ? !b.accepted : false; });
  save(); render();
}
function renderQuotes(p){
  const cards=p.quotes.map(q=>{
    const sorted=q.bids.map((b,i)=>({b,i})).sort((x,y)=>x.b.cents-y.b.cents);
    const low=sorted.length?sorted[0].b.cents:null;
    const high=sorted.length?sorted[sorted.length-1].b.cents:null;
    const bidsHTML=q.bids.length?q.bids.map((b,i)=>`
      <div class="bid ${b.accepted?"accepted":""}">
        <div class="who">${esc(b.contractor)}</div>
        <div class="amt money ${b.accepted?"v-ok":""}">${fmt(b.cents)}</div>
        <div class="sub">${esc(b.notes||"—")}</div>
        <div class="q-actions no-print">
          <button class="small ${b.accepted?"":"primary"}" onclick="acceptBid('${q.id}',${i})">${b.accepted?"✓ Accepted":"Accept"}</button>
          <button class="small icon" onclick="bidForm('${q.id}',${i})" title="Edit">✎</button>
          <button class="small icon danger" onclick="deleteBid('${q.id}',${i})" title="Remove">🗑</button>
        </div></div>`).join(""):`<div class="empty">No bids yet.</div>`;
    return `<div class="card" style="margin-bottom:12px">
      <div class="rowline" style="border:0;padding-top:0"><div style="flex:1">
        <div class="catname">${esc(q.jobTitle)}</div>
        <div class="sub">${esc(catName(p,q.categoryId))} · requested ${esc(q.date)} · ${q.bids.length}/4 bids
        ${low!==null?` · range <span class="money">${fmt(low)}–${fmt(high)}</span>`:""}</div></div>
        <div class="q-actions no-print">
          <button class="small primary" onclick="bidForm('${q.id}')">+ Add bid</button>
          <button class="small icon" onclick="quoteForm('${q.id}')" title="Edit">✎</button>
          <button class="small icon danger" onclick="deleteQuote('${q.id}')" title="Delete">🗑</button>
        </div></div>
      <div class="quote-grid">${bidsHTML}</div></div>`;
  }).join("");
  return `<div class="toolbar no-print"><button class="small primary" onclick="quoteForm()">+ New quote request</button>
    <span class="muted">Store up to 4 bids per job, compare side by side, mark the winner.</span></div>
    ${p.quotes.length?cards:`<div class="card"><div class="empty">No quote requests yet — e.g. “Kitchen rewire”, then collect bids.</div></div>`}`;
}

/* ---------- change orders ---------- */
function coForm(editId){
  const p=P(); if(!p) return;
  const c=editId?p.changeOrders.find(x=>x.id===editId):null;
  const opts=p.categories.filter(x=>x.name!==CONTINGENCY_NAME).map(x=>[x.id,x.name]);
  dlgForm(c?"Edit change order":"New change order",[
    {k:"description",lbl:"Description",val:c?c.description:"",req:true,ta:true,ph:"Added under-cabinet lighting…"},
    {k:"categoryId",lbl:"Category",type:"select",val:c?c.categoryId:(opts[0]?opts[0][0]:""),opts},
    {k:"impact",lbl:"Cost impact ($) — use negative for a credit",type:"number",step:"0.01",val:c?(c.deltaCents/100).toFixed(2):"",req:true,ph:"0.00"},
    {k:"date",lbl:"Date",type:"date",val:c?c.date:todayStr()},
    {k:"status",lbl:"Status",type:"select",val:c?c.status:"proposed",opts:[["proposed","Proposed"],["approved","Approved"],["rejected","Rejected"]]}
  ],(vals)=>{
    const dc=toCents(vals.impact);
    if(c){ Object.assign(c,{description:vals.description.trim(),categoryId:vals.categoryId,deltaCents:dc,date:vals.date,status:vals.status}); }
    else{ p.changeOrders.push({id:uid(),description:vals.description.trim(),categoryId:vals.categoryId,deltaCents:dc,date:vals.date,status:vals.status}); coFilter="all"; }
    save(); render();
  },{saveLabel:c?"Save":"Add change order",
      note:"Approved change orders roll into that category's actuals and draw on your contingency guard."});
}
function deleteCO(id){
  const p=P(); const c=p.changeOrders.find(x=>x.id===id); if(!c) return;
  dlgConfirm(`Delete this change order (${fmtSigned(c.deltaCents)})?`,
    ()=>{ p.changeOrders=p.changeOrders.filter(x=>x.id!==id); save(); render(); });
}
function setCOStatus(id,st){
  const p=P(); const c=p.changeOrders.find(x=>x.id===id); if(!c) return;
  c.status=st; save(); render();
}
function renderChanges(p){
  const list=p.changeOrders.filter(c=>coFilter==="all"||c.status===coFilter)
    .sort((a,b)=>b.date.localeCompare(a.date));
  const appr=p.changeOrders.filter(c=>c.status==="approved");
  const apprCents=appr.reduce((t,c)=>t+c.deltaCents,0);
  const coAlloc=contingencyAllocCents(p), coRem=contingencyRemainingCents(p);
  const rows=list.map(c=>`<tr>
    <td data-l="Date">${esc(c.date)}</td>
    <td data-l="Description">${esc(c.description)}<div class="sub">${esc(catName(p,c.categoryId))}</div></td>
    <td data-l="Impact" class="num money ${c.deltaCents<0?"pos":""}">${fmtSigned(c.deltaCents)}</td>
    <td data-l="Status"><span class="badge b-${c.status}">${c.status}</span></td>
    <td data-l="Actions" class="no-print"><div class="q-actions">
      ${c.status!=="approved"?`<button class="small" onclick="setCOStatus('${c.id}','approved')">Approve</button>`:""}
      ${c.status!=="rejected"?`<button class="small" onclick="setCOStatus('${c.id}','rejected')">Reject</button>`:""}
      ${c.status!=="proposed"?`<button class="small" onclick="setCOStatus('${c.id}','proposed')">Reopen</button>`:""}
      <button class="small icon" onclick="coForm('${c.id}')" title="Edit">✎</button>
      <button class="small icon danger" onclick="deleteCO('${c.id}')" title="Delete">🗑</button>
    </div></td></tr>`).join("");
  const filterBtns=["all","proposed","approved","rejected"].map(f=>
    `<button class="small ${coFilter===f?"primary":""}" onclick="coFilter='${f}';render()">${f[0].toUpperCase()+f.slice(1)}</button>`).join("");
  return `
  <div class="grid3" style="margin-bottom:14px">
    <div class="stat"><div class="k">Contingency set</div><div class="v money">${fmt(coAlloc)}</div><div class="sub">${p.contingencyPct}% of base budget</div></div>
    <div class="stat"><div class="k">Approved change orders</div><div class="v money">${fmt(apprCents)}</div><div class="sub">${appr.length} approved</div></div>
    <div class="stat"><div class="k">Contingency remaining</div><div class="v money ${coRem<0?"v-bad":(coRem<coAlloc*0.25?"v-warn":"v-ok")}">${fmt(coRem)}</div>
      <div class="sub">net approved change orders draw on it</div></div>
  </div>
  <div class="card"><div class="toolbar no-print">
      <button class="small primary" onclick="coForm()">+ New change order</button>
      <span class="right"></span><div class="q-actions">${filterBtns}</div></div>
    ${list.length?`<div style="overflow-x:auto"><table class="resp"><thead><tr><th>Date</th><th>Description</th><th class="num">Impact</th><th>Status</th><th class="no-print">Actions</th></tr></thead><tbody>${rows}</tbody></table></div>`
    :`<div class="empty">No change orders${coFilter==="all"?" yet":" with this status"}.</div>`}</div>`;
}

/* ---------- export / import ---------- */
function asStr(v,fb){ return typeof v==="string"?v:(v===null||v===undefined?fb:String(v)); }
function asCents(v){ v=Number(v); return isFinite(v)?Math.round(v):0; }
function asDate(v,fb){ return /^\d{4}-\d{2}-\d{2}$/.test(asStr(v,""))?asStr(v,""):fb; }
function sanitizeState(s){
  const clean={version:1,theme:(s.theme==="dark"||s.theme==="light")?s.theme:null,
    activeProjectId:asStr(s.activeProjectId,null),projects:[]};
  for(const p of s.projects){
    const cp={id:asStr(p.id,uid()),name:asStr(p.name,"Project").slice(0,120),
      createdAt:asCents(p.createdAt)||Date.now(),
      contingencyPct:Math.min(50,Math.max(0,parseInt(p.contingencyPct,10)||0)),
      categories:[],expenses:[],quotes:[],changeOrders:[]};
    const catIds=new Set();
    for(const c of p.categories){
      const cc={id:asStr(c.id,uid()),name:asStr(c.name,"Category").slice(0,80),budgetCents:Math.max(0,asCents(c.budgetCents))};
      if(catIds.has(cc.id)) cc.id=uid();
      catIds.add(cc.id); cp.categories.push(cc);
    }
    if(!cp.categories.length) cp.categories.push({id:uid(),name:"General",budgetCents:0});
    const okCat=id=>catIds.has(id)?id:cp.categories[0].id;
    for(const e of p.expenses) cp.expenses.push({id:asStr(e.id,uid()),date:asDate(e.date,todayStr()),
      categoryId:okCat(e.categoryId),vendor:asStr(e.vendor,"").slice(0,120),
      cents:Math.max(0,asCents(e.cents)),note:asStr(e.note,"").slice(0,500)});
    for(const q of p.quotes){
      const cq={id:asStr(q.id,uid()),jobTitle:asStr(q.jobTitle,"Job").slice(0,120),
        categoryId:okCat(q.categoryId),date:asDate(q.date,todayStr()),bids:[]};
      for(const b of (Array.isArray(q.bids)?q.bids:[]).slice(0,4))
        cq.bids.push({contractor:asStr(b.contractor,"").slice(0,120),cents:Math.max(0,asCents(b.cents)),
          notes:asStr(b.notes,"").slice(0,500),accepted:b.accepted===true});
      // at most one accepted bid survives
      let seen=false;
      for(const b of cq.bids){ if(b.accepted){ if(seen) b.accepted=false; else seen=true; } }
      cp.quotes.push(cq);
    }
    const STATUSES=["proposed","approved","rejected"];
    for(const c of p.changeOrders)
      cp.changeOrders.push({id:asStr(c.id,uid()),description:asStr(c.description,"").slice(0,500),
        categoryId:okCat(c.categoryId),deltaCents:asCents(c.deltaCents),
        date:asDate(c.date,todayStr()),status:STATUSES.includes(c.status)?c.status:"proposed"});
    clean.projects.push(cp);
  }
  if(!clean.projects.some(p=>p.id===clean.activeProjectId))
    clean.activeProjectId=clean.projects[0].id;
  return clean;
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="renotrack-backup-"+todayStr()+".json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const s=JSON.parse(r.result);
      if(!s||typeof s!=="object"||!Array.isArray(s.projects)) throw new Error("bad shape");
      for(const p of s.projects){
        if(typeof p.id!=="string"||typeof p.name!=="string"||!Array.isArray(p.categories)||
           !Array.isArray(p.expenses)||!Array.isArray(p.quotes)||!Array.isArray(p.changeOrders)) throw new Error("bad project");
      }
      dlgConfirm("Import will REPLACE all current data. Continue?",()=>{
        S=sanitizeState(s);
        save(); initTheme(); renderProjectSel(); render(); Sound.success();
      });
    }catch(e){ dlgAlert("That file isn't a valid RenoTrack backup."); Sound.error(); }
  };
  r.readAsText(file);
}

/* ---------- render ---------- */
function render(){
  const p=P();
  if(!p){
    document.getElementById("view").innerHTML=`<div class="card"><div class="empty">No project yet.</div></div>`;
    return;
  }
  const el=document.getElementById("view");
  if(activeTab==="dashboard") el.innerHTML=renderDashboard(p);
  else if(activeTab==="budget") el.innerHTML=renderBudget(p);
  else if(activeTab==="quotes") el.innerHTML=renderQuotes(p);
  else if(activeTab==="changes") el.innerHTML=renderChanges(p);
  // live budget inputs
  el.querySelectorAll("input[data-budget]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const c=catById(p,inp.dataset.budget); if(!c) return;
      const v=toCents(inp.value);
      if(v<0){ dlgAlert("Budget can't be negative."); inp.value=(c.budgetCents/100).toFixed(2); return; }
      c.budgetCents=v; save(); render();
    });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); } });
  });
  const coPct=document.getElementById("coPct");
  if(coPct) coPct.addEventListener("change",()=>{
    let v=parseInt(coPct.value,10);
    if(!isFinite(v)||v<0) v=0; if(v>50) v=50;
    p.contingencyPct=v; save(); render();
  });
}

/* ---------- init ---------- */
function init(){
  S=load();
  if(!S){ S=blankState(); S.projects.push(blankProject("Project 1")); S.activeProjectId=S.projects[0].id; save(); }
  else if(!S.projects.length){ S.projects.push(blankProject("Project 1")); S.activeProjectId=S.projects[0].id; save(); }
  else if(!P()){ S.activeProjectId=S.projects[0].id; save(); }
  initTheme();
  document.getElementById("themeToggle").onclick=()=>{
    const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
    applyTheme(t); Sound.toggleTheme(); Sound.click();
  };
  document.getElementById("exportBtn").onclick=()=>{ exportData(); Sound.success(); };
  document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
  document.getElementById("importFile").addEventListener("change",e=>{
    if(e.target.files[0]) importData(e.target.files[0]);
    e.target.value="";
  });
  document.getElementById("newProjBtn").onclick=newProject;
  document.getElementById("renameProjBtn").onclick=renameProject;
  document.getElementById("delProjBtn").onclick=deleteProject;
  renderProjectSel(); renderTabs(); render();
  paintSample();
  const sb=document.getElementById("soundToggle"); if(sb) paintSoundBtn(sb);
}
document.addEventListener("DOMContentLoaded",init);
