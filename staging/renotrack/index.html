<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free offline home renovation budget tracker: set category budgets, log expenses, compare contractor quotes, and manage change orders with a contingency buffer. No account, no subscription — your data never leaves this device.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b45309'/%3E%3Ctext x='32' y='44' font-size='28' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%9A%92%3C/text%3E%3C/svg%3E">
<title>Free Home Renovation Budget Tracker: Remodel Cost Planner & Quote Comparison (RenoTrack)</title>
<style>
:root{
  --bg:#f4f6f9; --bg2:#eef1f5; --card:#ffffff; --ink:#1c2430; --ink2:#5b6b7d;
  --line:#dde4ec; --accent:#0f7b6c; --accent-d:#0a5f53; --accent-soft:#e0f2ee;
  --warn:#b45309; --warn-soft:#fef3e2; --danger:#c2410c; --danger-soft:#fdeee6;
  --ok:#15803d; --ok-soft:#e7f6ec; --bar:#cbd5e1; --radius:12px;
  --shadow:0 1px 3px rgba(20,35,55,.08),0 4px 14px rgba(20,35,55,.06);
}
html[data-theme="dark"]{
  --bg:#12161c; --bg2:#171c24; --card:#1c222c; --ink:#e8edf3; --ink2:#9aa7b8;
  --line:#2b3442; --accent:#2dd4a7; --accent-d:#7ce8c8; --accent-soft:#14332c;
  --warn:#f59e0b; --warn-soft:#33260e; --danger:#f87171; --danger-soft:#3a1d16;
  --ok:#4ade80; --ok-soft:#12301f; --bar:#334052;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top-in{max-width:1060px;margin:0 auto;padding:10px 16px;display:flex;
  align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;
  letter-spacing:.2px}
.logo svg{width:30px;height:30px}
.tagline{font-size:12px;color:var(--ink2);margin-top:2px}
.spacer{flex:1}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--ink);border-radius:9px;padding:8px 14px;
  display:inline-flex;align-items:center;gap:7px}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);
  color:#fff;font-weight:600}
html[data-theme="dark"] button.primary,html[data-theme="dark"] .btn.primary{color:#06231d}
button.primary:hover{background:var(--accent-d)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.small{padding:5px 10px;font-size:13px;border-radius:7px}
button.icon{padding:6px;border-radius:8px;line-height:0}
svg.ic{width:16px;height:16px;flex:none}
/* Glenerds standard cluster: More Apps, flask, dark-mode, sound — circular 44x44 icon-only */
.g-header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.g-round-btn{flex:0 0 auto;width:44px;height:44px;min-width:44px;min-height:44px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);color:var(--ink);
  border-radius:999px;cursor:pointer;font-size:1.1rem;
  box-shadow:0 2px 8px rgba(0,0,0,.10);
  transition:border-color .18s ease, transform .18s ease}
.g-round-btn svg{width:30px;height:30px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.g-round-btn.theme-toggle,.g-round-btn.sound-toggle{font-size:1.65rem;line-height:1}
.g-round-btn:hover{border-color:var(--accent)}.g-round-btn:active{transform:scale(.92);border-color:var(--accent)}

.g-round-btn:focus{outline:none}
.g-round-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.g-round-btn.sample-toggle[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);
  background:var(--accent-soft)}
@media(max-width:480px){.g-header-actions{gap:6px}}
main{max-width:1060px;margin:0 auto;padding:18px 16px 60px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type="number"]{text-align:right}
label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);
  margin:0 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px}
.card h2{margin:0 0 12px;font-size:17px}
.card h3{margin:14px 0 8px;font-size:15px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px}
.stat[role="button"]{cursor:pointer;transition:border-color .18s ease}
.stat[role="button"]:hover{border-color:var(--accent)}
.stat[role="button"]:focus{outline:none;filter:drop-shadow(0 0 5px var(--accent))}
.stat[role="button"][aria-pressed="true"]{border-color:var(--accent)}
.stat .k{font-size:12px;color:var(--ink2);font-weight:600;text-transform:uppercase;
  letter-spacing:.5px}
.stat .v{font-size:22px;font-weight:800;margin-top:3px}
.stat .v small{font-size:13px;font-weight:600;color:var(--ink2)}
.v-ok{color:var(--ok)} .v-warn{color:var(--warn)} .v-bad{color:var(--danger)}
.bar{height:10px;border-radius:6px;background:var(--bar);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--accent);
  transition:width .3s}
.bar>i.over{background:var(--danger)}
.bar>i.near{background:var(--warn)}
.rowline{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:0}
.catname{font-weight:600}
.sub{font-size:13px;color:var(--ink2)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.over-tag{font-size:11px;font-weight:700;color:#fff;background:var(--danger);
  border-radius:6px;padding:2px 7px;text-transform:uppercase;letter-spacing:.4px}
.near-tag{font-size:11px;font-weight:700;color:#fff;background:var(--warn);
  border-radius:6px;padding:2px 7px;text-transform:uppercase;letter-spacing:.4px}
nav.tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}
nav.tabs button{border-radius:999px;padding:8px 16px;font-weight:600;
  background:transparent;border:1px solid transparent;color:var(--ink2)}
nav.tabs button.active{background:var(--accent-soft);color:var(--accent-d);
  border-color:var(--accent)}
html[data-theme="dark"] nav.tabs button.active{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);
  text-align:left;padding:8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.over td{background:var(--danger-soft)}
td.num,th.num{text-align:right}
.empty{padding:26px;text-align:center;color:var(--ink2);font-size:14px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);
  color:var(--ink);padding:0;max-width:520px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,18,28,.5)}
.dlg-in{padding:20px}
.dlg-in h2{margin:0 0 14px;font-size:18px}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.field{margin-bottom:12px}
.quote-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.bid{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg2)}
.bid.accepted{border:2px solid var(--accent);background:var(--accent-soft)}
.bid .who{font-weight:700}
.bid .amt{font-size:20px;font-weight:800;margin:4px 0}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;
  padding:2px 8px;text-transform:uppercase;letter-spacing:.4px}
.b-proposed{background:var(--warn-soft);color:var(--warn)}
.b-approved{background:var(--ok-soft);color:var(--ok)}
.b-rejected{background:var(--danger-soft);color:var(--danger)}
.pill{font-size:12px;background:var(--accent-soft);color:var(--accent-d);
  font-weight:700;border-radius:999px;padding:3px 10px}
html[data-theme="dark"] .pill{color:var(--accent)}
.alert{border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px;
  display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--warn-soft);border:1px solid var(--warn);color:inherit}
.alert.bad{background:var(--danger-soft);border:1px solid var(--danger);color:inherit}
.alert.ok{background:var(--ok-soft);border:1px solid var(--ok);color:inherit}
footer{border-top:1px solid var(--line);padding:18px 16px 30px;text-align:center;
  color:var(--ink2);font-size:13px}
footer a{color:var(--accent);text-decoration:none;font-weight:600}
.projbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.projbar select{width:auto;min-width:200px;font-weight:700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.right{margin-left:auto}
.muted{color:var(--ink2);font-size:13px}
.neg{color:var(--danger)} .pos{color:var(--ok)}
.q-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
@media (max-width:700px){
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .top-in{padding:8px 12px}
  main{padding:14px 12px 50px}
  .stat .v{font-size:19px}
  table.resp thead{display:none}
  table.resp tr{display:block;border:1px solid var(--line);border-radius:10px;
    margin-bottom:10px;padding:6px 10px}
  table.resp td{display:flex;justify-content:space-between;align-items:center;
    border:0;padding:6px 0}
  table.resp td::before{content:attr(data-l);font-size:12px;font-weight:700;
    color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;margin-right:12px}
  table.resp td.num{justify-content:space-between}
  .toolbar .right{margin-left:0}
}
@media print{
  header.top,nav.tabs,.toolbar,.no-print,footer,.dlg-actions{display:none!important}
  body{background:#fff;color:#111;font-size:12px}
  main{max-width:none;padding:0}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;margin-bottom:12px}
  .stat .v{font-size:18px}
  table.resp thead{display:table-header-group}
  table.resp tr{display:table-row;border:0;margin:0;padding:0}
  table.resp td{display:table-cell;border-bottom:1px solid #ccc;padding:6px}
  table.resp td::before{content:none}
  :root{--card:#fff;--ink:#111;--ink2:#555;--line:#ccc;--bg:#fff;--bg2:#f5f5f5;
    --bar:#ddd;--accent:#0f7b6c;--accent-d:#0a5f53;--accent-soft:#e0f2ee}
}
/* ---- donut chart (spend mix) ---- */
.donut-flex{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donut-svg{width:170px;max-width:46vw;height:auto;flex:none}
.donut-seg{cursor:pointer;transition:opacity .2s}
.donut-seg.dim{opacity:.22}
.donut-seg:focus{outline:none;filter:drop-shadow(0 0 4px var(--accent))}
.donut-c1{font-size:17px;font-weight:800;fill:var(--ink);pointer-events:none}
.donut-c2{font-size:11px;fill:var(--ink2);pointer-events:none}
.donut-legend{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.leg-btn{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;
  border-radius:8px;padding:5px 8px;font-size:13px;color:var(--ink);text-align:left;width:100%;cursor:pointer}
.leg-btn:hover{border-color:var(--line);background:var(--bg2)}
.leg-btn .sw{width:12px;height:12px;border-radius:4px;flex:none}
.leg-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* ---- spending-pace sparkline ---- */
.chart-kicker{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  color:var(--ink2);margin-bottom:6px}
.pace-svg{width:100%;height:auto;display:block}
.pace-dot{fill:#2dd4a7;stroke:var(--card);stroke-width:2;cursor:pointer}
.pace-dot.sel{stroke:#0f7b6c;stroke-width:3}
.pace-dot:focus{outline:none;filter:drop-shadow(0 0 4px var(--accent))}
#paceWrap{border-radius:8px;cursor:crosshair}
#paceWrap:focus{outline:none}
#paceWrap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chart-readout{font-size:13px;margin-top:8px;min-height:1.5em}
.chart-readout .muted{color:var(--ink2)}
.axlbl{fill:var(--ink2);font-size:11px}
/* ---- category-row spotlight + clickable expense rows ---- */
.cat-row{cursor:pointer;border-radius:8px}
.cat-row:hover{background:var(--bg2)}
.cat-row.dim{opacity:.4}
.cat-row:focus{outline:none}
.cat-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.exp-row{cursor:pointer}
.exp-row:hover td{background:var(--bg2)}
.exp-row:focus{outline:none}
.exp-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.quote-card{cursor:pointer}
.bid-card{cursor:pointer}
.bid-card:focus{outline:none}
.bid-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
tr.co-row{cursor:pointer}
tr.co-row:hover td{background:var(--bg2)}
tr.co-row:focus{outline:none}
tr.co-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.spot-note{font-size:13px;background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;margin-bottom:10px}
.spot-note strong{color:var(--accent-d)}
html[data-theme="dark"] .spot-note strong{color:var(--accent)}
/* donut spotlight breakdown panel (chart-detail pattern) */
#donutDetail{margin-top:12px;margin-bottom:0}
#statDetail{margin-bottom:14px}
#donutDetail .cd-head,#statDetail .cd-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#donutDetail .cd-head strong,#statDetail .cd-head strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#donutDetail .cd-title,#statDetail .cd-title{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#donutDetail .cd-sub,#statDetail .cd-sub{font-size:12px;color:var(--ink2)}
#donutDetail .cd-count,#statDetail .cd-count{font-size:12px;color:var(--ink2);white-space:nowrap}
#donutDetail .cd-x,#statDetail .cd-x{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1;cursor:pointer}
#donutDetail .cd-rows,#statDetail .cd-rows{display:grid;gap:6px;max-height:240px;overflow:auto}
#donutDetail .cd-row,#statDetail .cd-row{display:flex;align-items:baseline;gap:10px;padding:7px 10px;border-radius:8px;background:var(--bg)}
#donutDetail .cd-name,#statDetail .cd-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#donutDetail .cd-val,#statDetail .cd-val{font-weight:700;white-space:nowrap}
#donutDetail .cd-val{font-weight:700;white-space:nowrap}
/* Glenerds cross-promo: More Apps button + bottom CTA (shared) */
.g-header-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.g-store-btn {
  display: inline-flex; align-items: center;
  background: var(--g-accent, #4f46e5);
  color: #fff;
  border-radius: var(--g-radius-pill, 999px);
  padding: 8px 15px;
  font-size: 0.88rem; font-weight: 700; line-height: 1.2;
  text-decoration: none; white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,.12);
  transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
}
.g-store-btn:hover { background: var(--g-accent-hover, #4338ca); color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.16); }
html[data-theme="dark"] .g-store-btn, html[data-theme="dark"] .g-store-btn:hover { color: #fff; }
.g-store-btn:active { transform: scale(0.97); }
.g-store-btn:focus-visible { outline: 2px solid var(--g-accent, #4f46e5); outline-offset: 2px; }
.g-cta-strip {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin: 28px 0 0; padding: 16px 20px;
  border-radius: 14px;
  background: rgba(79,70,229,.08);
  border: 1px solid rgba(79,70,229,.28);
  color: inherit;
  font-size: 0.95rem; font-weight: 600;
  text-decoration: none;
  transition: background .18s ease, border-color .18s ease, transform .18s ease;
}
.g-cta-strip:hover { background: rgba(79,70,229,.14); border-color: rgba(79,70,229,.45); }
.g-cta-strip:active { transform: scale(0.99); }
.g-cta-strip:focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
.g-cta-strip .g-cta-arrow { color: #4f46e5; font-weight: 700; font-size: 1.4em; line-height: 1; vertical-align: -0.08em; }
[data-theme="dark"] .g-cta-strip .g-cta-arrow { color: #a5b4fc; }
@media (max-width: 440px) {
  .g-store-btn { padding: 8px 12px; }
  .g-header-actions { gap: 6px; }
}
@media print {
  .g-store-btn, .g-header-actions, .g-cta-strip { display: none !important; }
}
</style>
</head>
<body>
<header class="top no-print">
  <div class="top-in">
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="14" width="28" height="14" rx="2" fill="#0f7b6c"/><rect x="2" y="14" width="28" height="5" rx="2" fill="#2dd4a7"/><path d="M7 8l4-4 4 4M9 4v6" stroke="#0f7b6c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="18" y="4" width="9" height="6" rx="1" fill="#f4b942"/></svg>
      <div>RenoTrack<div class="tagline">Home Renovation Budget Tracker</div></div>
    </div>
    <div class="spacer"></div>
    <button id="exportBtn" class="small" title="Download all data as JSON">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
      Export
    </button>
    <button id="importBtn" class="small" title="Restore data from a JSON file">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 21h16"/></svg>
      Import
    </button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div class="g-header-actions">
      <a class="g-store-btn" href="https://glenerds.gumroad.com" target="_blank" rel="noopener">More Apps</a>
      <button class="g-round-btn sample-toggle" id="sampleToggle" type="button" aria-pressed="false" aria-label="Try sample data" title="Try sample data" onclick="setSample(!sampleOn);Sound.click();"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5h5"/><path d="M10.5 2.5v6l-5.6 9.2A1.7 1.7 0 0 0 6.4 20.5h11.2a1.7 1.7 0 0 0 1.5-2.8l-5.6-9.2v-6"/><circle cx="11" cy="14.8" r="1.2"/><circle cx="14" cy="16.8" r=".85"/><circle cx="10" cy="17.8" r=".6"/></svg></button>
      <button class="g-round-btn theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
      <button class="g-round-btn sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="Sound: on" title="Toggle sounds (on)" onclick="toggleSound(this)">🔊</button>
    </div>
  </div>
</header>
<main>
  <div class="projbar no-print">
    <label class="lbl" for="projectSel" style="margin:0">Project</label>
    <select id="projectSel"></select>
    <button id="newProjBtn" class="small">+ New</button>
    <button id="renameProjBtn" class="small" title="Rename project">Rename</button>
    <button id="delProjBtn" class="small danger" title="Delete project">Delete</button>
  </div>
  <nav class="tabs no-print" id="tabs" role="tablist"></nav>
  <div id="view"></div>

<script>
"use strict";
/* ============ RenoTrack core ============ */
const LS_KEY = "renotrack-v1";
const CATEGORIES_PRESET = ["Demolition","Structural","Plumbing","Electrical","Kitchen",
  "Bathrooms","Flooring","Paint & Drywall","Fixtures & Finishes","Appliances",
  "Permits & Fees","Labor","Contingency"];
const CONTINGENCY_NAME = "Contingency";

/* ---------- money: exact cents ---------- */
/* ---------- money: exact cents (string-parsed, no float drift) ---------- */
function toCents(v){
  if(v===null||v===undefined) return 0;
  let s=String(v).trim().replace(/[$,\s]/g,"");
  if(s==="") return 0;
  let neg=false;
  if(s[0]==="-"){ neg=true; s=s.slice(1); }
  else if(s[0]==="+"){ s=s.slice(1); }
  if(!/^\d*(\.\d*)?$/.test(s)) return 0;
  const parts=s.split(".");
  const dollars=parts[0]===""?0:parseInt(parts[0],10);
  let frac=(parts[1]||"").replace(/\D/g,"");
  while(frac.length<3) frac+="0";          // keep 3rd decimal for rounding
  let cents=dollars*100+parseInt(frac.slice(0,2),10);
  if(parseInt(frac[2],10)>=5) cents+=1;    // round half up
  return neg?-cents:cents;
}
function fmt(cents){
  const neg = cents<0, a = Math.abs(Math.round(cents));
  return (neg?"-$":"$") + Math.floor(a/100).toLocaleString("en-US") +
    "." + String(a%100).padStart(2,"0");
}
function fmtSigned(cents){ return (cents<0?"-":"+") + fmt(Math.abs(cents)); }
function pct(part,whole){
  part=Number(part); whole=Number(whole);
  if(!isFinite(part)) part=0;
  if(!isFinite(whole)||whole<=0) return part>0?100:0;
  return (part/whole)*100;
}
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }

/* ---------- state ---------- */
let S = null;           // whole app state
let activeTab = "dashboard";
let coFilter = "all";   // change-order status filter

function blankState(){ return {version:1, theme:null, activeProjectId:null, projects:[]}; }
function blankProject(name){
  return { id:uid(), name:name||"New project", createdAt:Date.now(),
    contingencyPct:10,
    categories: CATEGORIES_PRESET.map(n=>({id:uid(), name:n, budgetCents: n===CONTINGENCY_NAME?0:0})),
    expenses: [], quotes: [], changeOrders: [] };
}
let quotaWarned=false;
function save(){
  if(window.__gSampleOn || sampleOn) return; /* sample data is transient — never persisted */
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){
    if(!quotaWarned && e && e.name==="QuotaExceededError"){
      quotaWarned=true;
      dlgAlert("Browser storage is full — changes are NOT being saved. Export your data now so you don't lose work.");
    }
  }
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || typeof s!=="object" || !Array.isArray(s.projects)) return null;
    return s;
  }catch(e){ return null; }
}
function P(){ return S.projects.find(p=>p.id===S.activeProjectId) || null; }
function catById(p,id){ return p.categories.find(c=>c.id===id) || null; }
function catName(p,id){ const c=catById(p,id); return c?c.name:"—"; }
function isContingencyCat(p,id){ const c=catById(p,id); return !!c && c.name===CONTINGENCY_NAME; }

/* ---------- math (all in cents) ---------- */
function catExpensesCents(p,catId){
  return p.expenses.filter(e=>e.categoryId===catId).reduce((t,e)=>t+e.cents,0);
}
function catChangeCents(p,catId){ // approved change-order deltas in this category
  return p.changeOrders.filter(c=>c.categoryId===catId && c.status==="approved")
    .reduce((t,c)=>t+c.deltaCents,0);
}
function catActualCents(p,catId){ return catExpensesCents(p,catId)+catChangeCents(p,catId); }
function baseBudgetCents(p){ // sum of non-contingency category budgets
  return p.categories.filter(c=>c.name!==CONTINGENCY_NAME)
    .reduce((t,c)=>t+c.budgetCents,0);
}
function contingencyAllocCents(p){ return Math.round(baseBudgetCents(p)*p.contingencyPct/100); }
function totalBudgetCents(p){ return baseBudgetCents(p)+contingencyAllocCents(p); }
function actualSpentCents(p){ // everything actually spent incl. approved change orders
  const e = p.expenses.reduce((t,x)=>t+x.cents,0);
  const c = p.changeOrders.filter(x=>x.status==="approved").reduce((t,x)=>t+x.deltaCents,0);
  return e+c;
}
function acceptedQuotesCents(p){
  return p.quotes.reduce((t,q)=>t+q.bids.filter(b=>b.accepted).reduce((a,b)=>a+b.cents,0),0);
}
function committedCents(p){ return actualSpentCents(p)+acceptedQuotesCents(p); }
function remainingCents(p){ return totalBudgetCents(p)-committedCents(p); }
function contingencyConsumedCents(p){ // NET approved change-order cost draws on contingency
  return p.changeOrders.filter(x=>x.status==="approved").reduce((t,x)=>t+x.deltaCents,0);
}
function contingencyRemainingCents(p){ return contingencyAllocCents(p)-contingencyConsumedCents(p); }

/* ---------- theme (spec reference: emoji icon, white round button adapts via vars) ---------- */
function paintTheme(){
  const dark = document.documentElement.getAttribute("data-theme")==="dark";
  const b = document.getElementById("themeToggle"); if(!b) return;
  b.innerHTML = (dark) ? `<svg viewBox="0 0 48 48" width="32" height="32" aria-hidden="true"><g fill="#F59E0B"><path d="M24 3.5 L27.2 13.5 L20.8 13.5 Z" transform="rotate(0 24 24)"/><path d="M24 3.5 L27.2 13.5 L20.8 13.5 Z" transform="rotate(45 24 24)"/><path d="M24 3.5 L27.2 13.5 L20.8 13.5 Z" transform="rotate(90 24 24)"/><path d="M24 3.5 L27.2 13.5 L20.8 13.5 Z" transform="rotate(135 24 24)"/><path d="M24 3.5 L27.2 13.5 L20.8 13.5 Z" transform="rotate(180 24 24)"/><path d="M24 3.5 L27.2 13.5 L20.8 13.5 Z" transform="rotate(225 24 24)"/><path d="M24 3.5 L27.2 13.5 L20.8 13.5 Z" transform="rotate(270 24 24)"/><path d="M24 3.5 L27.2 13.5 L20.8 13.5 Z" transform="rotate(315 24 24)"/></g><circle cx="24" cy="24" r="10.5" fill="#FFC421"/><ellipse cx="19.5" cy="17.5" rx="2.2" ry="3" fill="#FFDF6B" transform="rotate(-25 19.5 17.5)"/></svg>` : "\uD83C\uDF19";
  const l = dark ? "Switch to light mode" : "Switch to dark mode";
  b.setAttribute("aria-pressed", dark?"true":"false");
  b.setAttribute("aria-label", l); b.title = l;
}
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  paintTheme();
  if(S){ S.theme=t; save(); }
}
function initTheme(){
  let t = S && S.theme ? S.theme :
    (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light");
  document.documentElement.setAttribute("data-theme", t);
  paintTheme();
  if(S && !S.theme){ S.theme=t; }
}

/* ---------- sample data toggle (transient: snapshot user data, never persisted) ---------- */
let sampleOn = false, sampleSnap = null;
const PAL = ["#4f8ef7","#f06f52","#2dd4a7","#f5b942","#e77eb5","#a78bfa","#38bdf8","#84cc16"];
let donutSegs = [], donutSel = -1, pacePtsArr = [], paceSel = -1, catSpotId = null;
function paintSample(){
  const b = document.getElementById("sampleToggle"); if(!b) return;
  /* ON tint comes from .sample-toggle[aria-pressed="true"] CSS — white button per spec */
  const l = sampleOn ? "Clear sample data" : "Try sample data";
  b.setAttribute("aria-pressed", sampleOn?"true":"false");
  b.setAttribute("aria-label", l); b.title = l;
}
function fillSample(){
  S = blankState();
  seedDemo();
  activeTab = "dashboard";
  renderProjectSel(); renderTabs(); render();
}
function setSample(on){
  window.__gSampleOn = !!on; /* global save-guard for the whole sample cycle */
  if(on && !sampleOn){
    sampleSnap = { json: JSON.stringify(S), activeTab };
    sampleOn = true;
    fillSample();
  } else if(!on && sampleOn){
    sampleOn = false;
    const snap = sampleSnap; sampleSnap = null;
    if(snap){
      S = JSON.parse(snap.json);
      activeTab = snap.activeTab || "dashboard";
    }
    /* repaint theme from the restored state (sample-off reverts any theme toggle made while sampling) */
    document.documentElement.setAttribute("data-theme", (S && S.theme) || "light");
    paintTheme();
    renderProjectSel(); renderTabs(); render();
  }
  paintSample();
}

/* ---------- subtle sounds (Web Audio oscillator, no files, offline) ---------- */
var Sound = (function(){
  const K = "renotrack.sound"; let on = true, ctx = null;
  try { if(window.localStorage.getItem(K)==="off") on=false; } catch(e){}
  function ac(){ try {
    if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; ctx = new AC(); }
    return ctx; } catch(e){ return null; } }
  function tone(freq, dur, type, vol, delay){
    const c = ac(); if(!c) return;
    function play(){ try {
      const t = c.currentTime + (delay||0), o = c.createOscillator(), g = c.createGain();
      o.type = type||"sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol||0.06, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.05); } catch(e){} }
    if(c.state==="suspended"){ c.resume().then(play, play); } else { play(); }
  }
  return {
    isOn(){ return on; },
    toggle(){ on=!on; try{ window.localStorage.setItem(K, on?"on":"off"); }catch(e){} return on; },
    click(){ if(on) tone(520,0.06,"sine",0.045); },
    select(){ if(on){ tone(660,0.07,"sine",0.055); tone(880,0.09,"sine",0.045,0.06); } },
    success(){ if(on){ tone(660,0.09,"sine",0.06); tone(990,0.12,"sine",0.05,0.08); } },
    error(){ if(on) tone(170,0.16,"sawtooth",0.045); },
    toggleTheme(){ if(on) tone(440,0.06,"triangle",0.05); }
  };
})();
function paintSoundBtn(btn){
  /* spec reference: emoji icon, button stays white in all states */
  const on = Sound.isOn();
  btn.textContent = on ? "🔊" : "🔇";
  btn.setAttribute("aria-pressed", on?"true":"false");
  btn.setAttribute("aria-label", "Sound: "+(on?"on":"off"));
  btn.title = "Toggle sounds ("+(on?"on":"off")+")";
}
function toggleSound(btn){
  Sound.toggle();
  paintSoundBtn(btn);
  Sound.click();
}

/* ---------- tabs ---------- */
const TABS=[["dashboard","Dashboard"],["budget","Budget & Expenses"],["quotes","Contractor Quotes"],["changes","Change Orders"]];
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(([id,lbl])=>
    `<button role="tab" data-tab="${id}" class="${id===activeTab?"active":""}">${lbl}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>
    b.onclick=()=>{activeTab=b.dataset.tab; renderTabs(); render(); Sound.click();});
}

/* ---------- projects ---------- */
function renderProjectSel(){
  const sel=document.getElementById("projectSel");
  sel.innerHTML = S.projects.map(p=>
    `<option value="${p.id}" ${p.id===S.activeProjectId?"selected":""}>${esc(p.name)}</option>`).join("");
  sel.onchange=()=>{ S.activeProjectId=sel.value; save(); render(); };
}
function newProject(){
  const p=blankProject("Project "+(S.projects.length+1));
  S.projects.push(p); S.activeProjectId=p.id; save();
  renderProjectSel(); render();
  dlgForm("Rename project",[{k:"name",lbl:"Project name",val:p.name,req:true}],(vals)=>{
    p.name=vals.name.trim().slice(0,120)||p.name; save(); renderProjectSel(); render();
  });
}
function renameProject(){
  const p=P(); if(!p) return;
  dlgForm("Rename project",[{k:"name",lbl:"Project name",val:p.name,req:true}],(vals)=>{
    p.name=vals.name.trim().slice(0,120)||p.name; save(); renderProjectSel(); render();
  });
}
function deleteProject(){
  const p=P(); if(!p) return;
  if(S.projects.length===1){
    dlgAlert("You can't delete your only project. Rename it instead."); return;
  }
  dlgConfirm(`Delete "${esc(p.name)}"? This removes its budgets, expenses, quotes and change orders.`,
    ()=>{
      S.projects=S.projects.filter(x=>x.id!==p.id);
      S.activeProjectId=S.projects[0].id; save(); renderProjectSel(); render();
    });
}

/* ---------- dialogs ---------- */
function openDlg(html){ const b=document.getElementById("dlgBody"); b.innerHTML=html; document.getElementById("dlg").showModal(); }
function closeDlg(){ document.getElementById("dlg").close(); }
function dlgAlert(msg){
  openDlg(`<h2>Heads up</h2><p>${msg}</p>
    <div class="dlg-actions"><button class="primary" onclick="closeDlg()">OK</button></div>`);
}
function dlgConfirm(msg,onYes){
  window._dlgYes=onYes;
  openDlg(`<h2>Confirm</h2><p>${msg}</p>
    <div class="dlg-actions"><button onclick="closeDlg()">Cancel</button>
    <button class="primary" onclick="closeDlg();window._dlgYes()">Delete</button></div>`);
}
// fields: [{k,lbl,type,val,req,step,opts,min,max,ph,ta}]
function dlgForm(title,fields,onSave,opts){
  opts=opts||{};
  const body=fields.map(f=>{
    let input="";
    if(f.type==="select"){
      input=`<select id="f_${f.k}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.val)?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
    }else if(f.ta){
      input=`<textarea id="f_${f.k}" rows="3" placeholder="${esc(f.ph||"")}">${esc(f.val??"")}</textarea>`;
    }else{
      input=`<input id="f_${f.k}" type="${f.type||"text"}" value="${esc(f.val??"")}"
        ${f.req?"required":""} ${f.min!==undefined?`min="${f.min}"`:""} ${f.max!==undefined?`max="${f.max}"`:""}
        ${f.step?`step="${f.step}"`:""} placeholder="${esc(f.ph||"")}">`;
    }
    return `<div class="field"><label class="lbl" for="f_${f.k}">${f.lbl}</label>${input}</div>`;
  }).join("");
  window._dlgSave=onSave;
  openDlg(`<h2>${esc(title)}</h2><form id="dlgFormEl">${body}
    ${opts.note?`<p class="muted">${opts.note}</p>`:""}
    <div class="dlg-actions"><button type="button" onclick="closeDlg()">Cancel</button>
    <button type="submit" class="primary">${esc(opts.saveLabel||"Save")}</button></div></form>`);
  document.getElementById("dlgFormEl").onsubmit=e=>{
    e.preventDefault();
    const vals={};
    for(const f of fields){ const el=document.getElementById("f_"+f.k); vals[f.k]=el.value; }
    if(fields.some(f=>f.req && !String(vals[f.k]).trim())) return;
    closeDlg(); window._dlgSave(vals);
  };
}

/* ---------- dashboard ---------- */
function barHTML(actual,budget){
  const p=pct(actual,budget);
  const cls=actual>budget?"over":(p>=90?"near":"");
  const tag=actual>budget?`<span class="over-tag">Over</span>`:(p>=90?`<span class="near-tag">Near</span>`:"");
  return `<div class="bar"><i class="${cls}" style="width:${Math.min(100,p)}%"></i></div>
    <div style="margin-top:5px">${tag}</div>`;
}
/* ---------- spend-mix donut + spending-pace sparkline (clickable) ---------- */
function renderDonut(p){
  const segs=p.categories.map(c=>({id:c.id,name:c.name,actual:catActualCents(p,c.id)}))
    .filter(s=>s.actual>0).sort((a,b)=>b.actual-a.actual);
  donutSegs=segs; donutSel=-1;
  const total=segs.reduce((t,s)=>t+s.actual,0);
  if(!total) return `<div class="empty">Log expenses to see your spend mix.</div><div id="donutWrap"></div>`;
  const C=2*Math.PI*54; let acc=0;
  const arcs=segs.map((s,i)=>{
    const frac=s.actual/total, len=Math.max(frac*C,0.6);
    const a=`<circle cx="70" cy="70" r="54" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="22" `+
      `stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" `+
      `transform="rotate(-90 70 70)" data-seg="${i}" class="donut-seg" tabindex="0" role="button" `+
      `aria-pressed="false" aria-label="${esc(s.name)}: ${fmt(s.actual)}, ${Math.round(frac*100)} percent of spend">`+
      `<title>${esc(s.name)} — ${fmt(s.actual)}</title></circle>`;
    acc+=len; return a;
  }).join("");
  /* names only — amounts live in the budget card; no redundant legend */
  const legend=segs.map((s,i)=>
    `<button type="button" class="leg-btn" data-seg="${i}" aria-pressed="false" title="Spotlight ${esc(s.name)}">`+
    `<span class="sw" style="background:${PAL[i%PAL.length]}"></span><span>${esc(s.name)}</span></button>`).join("");
  return `<div id="donutWrap"><div class="donut-flex">`+
    `<svg class="donut-svg" viewBox="0 0 140 140" role="img" aria-label="Actual spend by category, donut chart">${arcs}`+
    `<text x="70" y="66" text-anchor="middle" class="donut-c1" id="donutC1">${fmt(total)}</text>`+
    `<text x="70" y="84" text-anchor="middle" class="donut-c2" id="donutC2">spent</text></svg>`+
    `<div class="donut-legend">${legend}</div></div>`+
    `<div class="spot-note" id="donutDetail" aria-live="polite" hidden></div></div>`;
}
function donutSpot(i){
  const segs=donutSegs; if(!segs.length) return;
  const wrap=document.getElementById("donutWrap"); if(!wrap) return;
  donutSel=(donutSel===i)?-1:i;
  const total=segs.reduce((t,s)=>t+s.actual,0);
  wrap.querySelectorAll(".donut-seg").forEach(c=>{
    const on=parseInt(c.dataset.seg,10)===donutSel;
    c.classList.toggle("dim",donutSel>=0&&!on);
    c.setAttribute("aria-pressed",on?"true":"false");
  });
  wrap.querySelectorAll(".leg-btn").forEach(b=>{
    b.setAttribute("aria-pressed",(parseInt(b.dataset.seg,10)===donutSel)?"true":"false");
  });
  const c1=document.getElementById("donutC1"), c2=document.getElementById("donutC2");
  if(c1){
    if(donutSel>=0){ const s=segs[donutSel];
      c1.textContent=fmt(s.actual); c2.textContent=s.name+" · "+Math.round(s.actual/total*100)+"%";
    }else{ c1.textContent=fmt(total); c2.textContent="spent"; }
  }
  /* breakdown panel: the actual expenses + approved change orders behind the segment */
  const det=document.getElementById("donutDetail");
  if(det){
    if(donutSel>=0){
      const s=segs[donutSel], p=P();
      const items=p?p.expenses.filter(e=>e.categoryId===s.id)
        .map(e=>({t:(e.vendor||"Expense")+" · "+e.date,v:e.cents}))
        .concat(p.changeOrders.filter(c=>c.categoryId===s.id&&c.status==="approved")
          .map(c=>({t:"Change order · "+c.date,v:c.deltaCents}))):[];
      items.sort((a,b)=>b.v-a.v);
      det.innerHTML=`<div class="cd-head"><strong>${esc(s.name)}</strong>`+
        `<span class="cd-count">${items.length} item${items.length===1?"":"s"} · <span class="money">${fmt(s.actual)}</span></span>`+
        `<button type="button" class="cd-x" id="donutDetailX" aria-label="Clear selection and show totals">×</button></div>`+
        `<div class="cd-rows">`+items.map(it=>
          `<div class="cd-row"><span class="cd-name">${esc(it.t)}</span><span class="cd-val money">${fmt(it.v)}</span></div>`
        ).join("")+`</div>`;
      det.hidden=false;
      const x=document.getElementById("donutDetailX");
      if(x) x.addEventListener("click",ev=>{ev.stopPropagation();donutSpot(donutSel);});
    }else{ det.hidden=true; det.innerHTML=""; }
  }
  Sound.click();
}
function renderPace(p){
  const ev=[];
  p.expenses.forEach(e=>ev.push({d:e.date,c:e.cents,lbl:e.vendor||catName(p,e.categoryId)}));
  p.changeOrders.filter(c=>c.status==="approved").forEach(c=>ev.push({d:c.date,c:c.deltaCents,lbl:"Change order"}));
  ev.sort((a,b)=>a.d.localeCompare(b.d));
  paceSel=-1;
  if(!ev.length){ pacePtsArr=[]; return `<div class="empty">No dated spend yet — add expenses to see your spending pace.</div><div id="paceWrap"></div>`; }
  let cum=0;
  pacePtsArr=ev.map(e=>{ cum+=e.c; return {d:e.d,cum:cum,delta:e.c,lbl:e.lbl}; });
  const pts=pacePtsArr;
  const W=560,H=150,padL=8,padR=8,padT=10,padB=22;
  const t0=Date.parse(pts[0].d), t1=Date.parse(pts[pts.length-1].d);
  const X=dt=>padL+(t1===t0?(W-padL-padR)/2:(dt-t0)/(t1-t0)*(W-padL-padR));
  const max=Math.max(1,...pts.map(q=>q.cum));
  const Y=v=>padT+(H-padT-padB)-(v/max)*(H-padT-padB);
  const line=pts.map((q,i)=>(i?"L":"M")+X(Date.parse(q.d)).toFixed(1)+" "+Y(q.cum).toFixed(1)).join(" ");
  const base=(H-padB).toFixed(1);
  const area=line+` L${X(t1).toFixed(1)} ${base} L${X(t0).toFixed(1)} ${base} Z`;
  const dots=pts.map((q,i)=>`<circle class="pace-dot" data-i="${i}" cx="${X(Date.parse(q.d)).toFixed(1)}" cy="${Y(q.cum).toFixed(1)}" r="4.5" tabindex="0" role="button" aria-label="${esc(q.d)}: cumulative ${fmt(q.cum)}"><title>${esc(q.d)} — ${fmt(q.cum)}</title></circle>`).join("");
  return `<div class="chart-kicker">Cumulative spend over time</div>`+
    `<div id="paceWrap" tabindex="0" role="img" aria-label="Cumulative spending sparkline. Use left and right arrows to step through dated spend.">`+
    `<svg class="pace-svg" viewBox="0 0 ${W} ${H}" aria-hidden="true">`+
    `<path d="${area}" fill="rgba(45,212,167,.18)"/>`+

function paceSelFn(i){
  const pts=pacePtsArr; if(!pts.length) return;
  /* clicking the selected point again restores the default latest-cumulative view */
  const wasSel = (paceSel===i);
  paceSel = wasSel ? pts.length-1 : Math.max(0,Math.min(pts.length-1,i));
  document.querySelectorAll(".pace-dot").forEach(d=>
    d.classList.toggle("sel",!wasSel&&parseInt(d.dataset.i,10)===paceSel));
  const r=document.getElementById("paceReadout");
  if(r){ const q=pts[paceSel];
    r.innerHTML=wasSel?`<span class="muted">Latest: <b class="money">${fmt(q.cum)}</b> cumulative.</span>`
      :`${esc(q.d)} · ${fmtSigned(q.delta)} ${esc(q.lbl)} · cumulative <b class="money">${fmt(q.cum)}</b>`;
  }
  Sound.click();
}

/* ---------- stat-box detail: tap a stat for its real breakdown ---------- */
function statDetailHTML(kind){
  const p=P(); if(!p) return "";
  const tb=totalBudgetCents(p), act=actualSpentCents(p), com=committedCents(p), rem=remainingCents(p);
  const base=baseBudgetCents(p), coAlloc=contingencyAllocCents(p), coRem=contingencyRemainingCents(p);
  const acc=acceptedQuotesCents(p);
  const appr=p.changeOrders.filter(x=>x.status==="approved");
  const apprCents=appr.reduce((t,x)=>t+x.deltaCents,0);
  const expCents=p.expenses.reduce((t,x)=>t+x.cents,0);
  const rows=[];
  const row=(n,v)=>rows.push(`<div class="cd-row"><span class="cd-name">${esc(n)}</span><span class="cd-val money">${fmt(v)}</span></div>`);
  let title="", sub="";
  if(kind==="total"){
    title="Total budget — composition";
    sub=`Base ${fmt(base)} + contingency ${fmt(coAlloc)} (${p.contingencyPct}% of base)`;
    row("Base budget (category budgets)", base);
    row(`Contingency set-aside (${p.contingencyPct}% of base)`, coAlloc);
    row("Total budget", tb);
  }else if(kind==="spent"){
    title="Spent (actual) — composition";
    sub=`${p.expenses.length} expense${p.expenses.length===1?"":"s"} + net approved change orders`;
    row("Expenses", expCents);
    row("Net approved change orders", apprCents);
    row("Spent (actual)", act);
  }else if(kind==="committed"){
    title="Committed — composition";
    sub=`${com>tb?"Over budget by ":""}${fmt(Math.abs(tb-com))} vs total budget`;
    row("Spent (actual)", act);
    row("Accepted contractor quotes", acc);
    row("Committed", com);
  }else if(kind==="remaining"){
    title="Remaining — composition";
    sub=`Total ${fmt(tb)} − committed ${fmt(com)}`;
    row("Total budget", tb);
    row("Committed", com);
    row("Remaining", rem);
  }else if(kind==="cont-set"){
    title="Contingency set — composition";
    sub=`${p.contingencyPct}% of base budget ${fmt(base)}`;
    row("Base budget", base);
    row(`Contingency set-aside (${p.contingencyPct}%)`, coAlloc);
    row("Net approved change-order draw", apprCents);
  }else if(kind==="co-approved"){
    title="Approved change orders";
    sub=`${appr.length} approved · net ${fmtSigned(apprCents)}`;
    appr.slice().sort((a,b)=>Math.abs(b.deltaCents)-Math.abs(a.deltaCents)).slice(0,6)
      .forEach(c=>row((c.desc||"Change order")+" · "+c.date, c.deltaCents));
    if(appr.length>6) row(`…and ${appr.length-6} more`, 0);
  }else if(kind==="co-rem"){
    title="Contingency remaining — composition";
    const avg=appr.length?Math.round(Math.abs(apprCents)/appr.length):0;
    sub=avg>0&&coRem>0?`Would cover ~${Math.floor(coRem/avg)} more change orders at the average approved size of ${fmt(avg)}`:"No approved change orders yet";
    row("Contingency set-aside", coAlloc);
    row("Net approved change-order draw", apprCents);
    row("Contingency remaining", coRem);
  }else return "";
  return `<div class="cd-head"><div><div class="cd-title">${esc(title)}</div>`+
    `<div class="cd-sub">${sub}</div></div>`+
    `<button type="button" class="cd-x" id="statDetailX" aria-label="Close detail">×</button></div>`+
    `<div class="cd-rows">${rows.join("")}</div>`;
}
function statToggle(el){
  const was=el.getAttribute("aria-pressed")==="true";
  const card=document.getElementById("statDetail");
  document.querySelectorAll(".stat[role=\"button\"]").forEach(s=>s.setAttribute("aria-pressed","false"));
  if(was||!card){ if(card){ card.hidden=true; card.innerHTML=""; } Sound.click(); return; }
  const html=statDetailHTML(el.dataset.stat);
  if(!html){ Sound.click(); return; }
  el.setAttribute("aria-pressed","true");
  card.innerHTML=html; card.hidden=false;
  const x=document.getElementById("statDetailX");
  if(x) x.addEventListener("click",ev=>{ ev.stopPropagation(); statToggle(el); });
  Sound.click();
}

function renderDashboard(p){
  const tb=totalBudgetCents(p), act=actualSpentCents(p), com=committedCents(p),
        rem=remainingCents(p), usedPct=pct(com,tb);
  const coAlloc=contingencyAllocCents(p), coUsed=contingencyConsumedCents(p),
        coRem=contingencyRemainingCents(p);
  const coPct=coAlloc>0?pct(coUsed,coAlloc):0;
  let coAlert="";
  if(coAlloc>0 && coRem<0){
    coAlert=`<div class="alert bad"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
      <div><b>Contingency exceeded.</b> Approved change orders total <b class="money">${fmt(coUsed)}</b> against a <b class="money">${fmt(coAlloc)}</b> contingency — you are <b class="money neg">${fmt(-coRem)}</b> over.</div></div>`;
  }else if(coAlloc>0 && coPct>=75){
    coAlert=`<div class="alert warn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <div><b>Contingency running low.</b> ${Math.round(coPct)}% of your <b class="money">${fmt(coAlloc)}</b> contingency is committed to approved change orders (<b class="money">${fmt(coRem)}</b> left).</div></div>`;
  }
  const cats=p.categories.map(c=>{
    const a=catActualCents(p,c.id);
    const isCont=c.name===CONTINGENCY_NAME;
    const b=isCont?coAlloc:c.budgetCents;
    const pctv=b>0?Math.round(pct(a,b)):0;
    return `<div class="rowline cat-row" data-cat="${c.id}" tabindex="0" role="button" aria-pressed="false" title="Click to spotlight this category" aria-label="${esc(c.name)} category — click for details"><div style="flex:1;min-width:0">
      <div class="catname">${esc(c.name)}</div>
      <div class="sub"><span class="money">${fmt(a)}</span> of <span class="money">${fmt(b)}</span>${isCont?' <span class="pill">auto</span>':""} · ${pctv}%</div>
      ${barHTML(a,b)}</div>
      <div class="sub money" style="min-width:86px;text-align:right">${fmt(b-a)} left</div></div>`;
  }).join("");
  const recent=[...p.expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  const recentHTML=recent.length?`<table><thead><tr><th>Date</th><th>Category</th><th>Payee</th><th class="num">Amount</th></tr></thead><tbody>${
    recent.map(e=>`<tr class="exp-row" data-exp="${e.id}" tabindex="0" title="Click to edit this expense" aria-label="Edit expense ${fmt(e.cents)}${e.vendor?" to "+esc(e.vendor):""}"><td>${esc(e.date)}</td><td>${esc(catName(p,e.categoryId))}</td><td>${esc(e.vendor||"—")}</td><td class="num money">${fmt(e.cents)}</td></tr>`).join("")
  }</tbody></table>`:`<div class="empty">No expenses yet — add them under Budget &amp; Expenses.</div>`;
  return `
  ${coAlert}
  <div class="grid4" style="margin-bottom:14px">
    <div class="stat" data-stat="total" role="button" tabindex="0" aria-pressed="false" aria-label="Total budget — activate for composition"><div class="k">Total budget</div><div class="v money">${fmt(tb)}</div>
      <div class="sub">base ${fmt(baseBudgetCents(p))} + contingency ${fmt(coAlloc)}</div></div>
    <div class="stat" data-stat="spent" role="button" tabindex="0" aria-pressed="false" aria-label="Spent actual — activate for breakdown"><div class="k">Spent (actual)</div><div class="v money">${fmt(act)}</div>
      <div class="sub">accepted quotes add <span class="money">${fmt(acceptedQuotesCents(p))}</span></div></div>
    <div class="stat" data-stat="committed" role="button" tabindex="0" aria-pressed="false" aria-label="Committed — activate for breakdown"><div class="k">Committed</div><div class="v money">${fmt(com)}</div>
      <div class="sub">${usedPct.toFixed(1)}% of budget used</div>
      <div class="bar"><i class="${com>tb?"over":(usedPct>=90?"near":"")}" style="width:${Math.min(100,usedPct)}%"></i></div></div>
    <div class="stat" data-stat="remaining" role="button" tabindex="0" aria-pressed="false" aria-label="Remaining — activate for breakdown"><div class="k">Remaining</div><div class="v money ${rem<0?"v-bad":"v-ok"}">${fmt(rem)}</div>
      <div class="sub">contingency left: <span class="money ${coRem<0?"neg":""}">${fmt(coRem)}</span></div></div>
  </div>
  <div class="spot-note" id="statDetail" aria-live="polite" hidden></div>
  <div class="grid2" style="margin-bottom:14px">
    <div class="card"><h2>Spend mix</h2><div class="chart-kicker">Actual spend by category</div>${renderDonut(p)}</div>
    <div class="card"><h2>Spending pace</h2>${renderPace(p)}</div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Budget by category</h2><div class="spot-note" id="catDetail" hidden></div>${cats}</div>
    <div class="card"><h2>Recent expenses</h2>${recentHTML}
      <div class="toolbar no-print"><button class="small primary" onclick="expenseForm()">+ Add expense</button></div></div>
  </div>`;
}

function categoryForm(editId){

    {k:"name",lbl:"Category name",val:c?c.name:"",req:true}
  ],(vals)=>{

      dlgAlert("A category with that name already exists."); return;
    }
    if(c){ c.name=name; } else { p.categories.push({id:uid(),name,budgetCents:0}); }
    save(); render();
  });

function deleteCategory(id){
  const p=P(); if(!p) return;
  const c=catById(p,id); if(!c) return;
  if(p.categories.length<=1){ dlgAlert("You need at least one category."); return; }
  const used=p.expenses.some(e=>e.categoryId===id)||p.quotes.some(q=>q.categoryId===id)||
             p.changeOrders.some(x=>x.categoryId===id);

        </div></div>`).join(""):`<div class="empty">No bids yet.</div>`;
    return `<div class="card quote-card" style="margin-bottom:12px" data-qid="${q.id}" role="button" tabindex="0" title="Click to edit this quote request" aria-label="Quote request ${esc(q.jobTitle)} — activate to edit">
      <div class="rowline" style="border:0;padding-top:0"><div style="flex:1">
        <div class="catname">${esc(q.jobTitle)}</div>
        <div class="sub">${esc(catName(p,q.categoryId))} · requested ${esc(q.date)} · ${q.bids.length}/4 bids
        ${low!==null?` · range <span class="money">${fmt(low)}–${fmt(high)}</span>`:""}</div></div>
        <div class="q-actions no-print">
          <button class="small primary" onclick="bidForm('${q.id}')">+ Add bid</button>
          <button class="small icon" onclick="quoteForm('${q.id}')" title="Edit">✎</button>
          <button class="small icon danger" onclick="deleteQuote('${q.id}')" title="Delete">🗑</button>
        </div></div>
      <div class="quote-grid">${bidsHTML}</div></div>`;
  }).join("");
  return `<div class="toolbar no-print"><button class="small primary" onclick="quoteForm()">+ New quote request</button>
    <span class="muted">Store up to 4 bids per job, compare side by side, mark the winner.</span></div>
    ${p.quotes.length?cards:`<div class="card"><div class="empty">No quote requests yet — e.g. “Kitchen rewire”, then collect bids.</div></div>`}`;
}

/* ---------- change orders ---------- */
function coForm(editId){
  const p=P(); if(!p) return;
  const c=editId?p.changeOrders.find(x=>x.id===editId):null;
  const opts=p.categories.filter(x=>x.name!==CONTINGENCY_NAME).map(x=>[x.id,x.name]);
  dlgForm(c?"Edit change order":"New change order",[
    {k:"description",lbl:"Description",val:c?c.description:"",req:true,ta:true,ph:"Added under-cabinet lighting…"},
    {k:"categoryId",lbl:"Category",type:"select",val:c?c.categoryId:(opts[0]?opts[0][0]:""),opts},
    {k:"impact",lbl:"Cost impact ($) — use negative for a credit",type:"number",step:"0.01",val:c?(c.deltaCents/100).toFixed(2):"",req:true,ph:"0.00"},
    {k:"date",lbl:"Date",type:"date",val:c?c.date:todayStr()},
    {k:"status",lbl:"Status",type:"select",val:c?c.status:"proposed",opts:[["proposed","Proposed"],["approved","Approved"],["rejected","Rejected"]]}
  ],(vals)=>{
    const dc=toCents(vals.impact);
    if(c){ Object.assign(c,{description:vals.description.trim(),categoryId:vals.categoryId,deltaCents:dc,date:vals.date,status:vals.status}); }
    else{ p.changeOrders.push({id:uid(),description:vals.description.trim(),categoryId:vals.categoryId,deltaCents:dc,date:vals.date,status:vals.status}); coFilter="all"; }
    save(); render();
  },{saveLabel:c?"Save":"Add change order",
      note:"Approved change orders roll into that category's actuals and draw on your contingency guard."});
}
function deleteCO(id){
  const p=P(); const c=p.changeOrders.find(x=>x.id===id); if(!c) return;
  dlgConfirm(`Delete this change order (${fmtSigned(c.deltaCents)})?`,
    ()=>{ p.changeOrders=p.changeOrders.filter(x=>x.id!==id); save(); render(); });
}
function setCOStatus(id,st){
  const p=P(); const c=p.changeOrders.find(x=>x.id===id); if(!c) return;
  c.status=st; save(); render();
}
function renderChanges(p){
  const list=p.changeOrders.filter(c=>coFilter==="all"||c.status===coFilter)
    .sort((a,b)=>b.date.localeCompare(a.date));
  const appr=p.changeOrders.filter(c=>c.status==="approved");
  const apprCents=appr.reduce((t,c)=>t+c.deltaCents,0);
  const coAlloc=contingencyAllocCents(p), coRem=contingencyRemainingCents(p);
  const rows=list.map(c=>`<tr class="co-row" data-co="${c.id}" role="button" tabindex="0" title="Click to edit this change order" aria-label="Change order ${esc(c.description)} — activate to edit">
    <td data-l="Date">${esc(c.date)}</td>
    <td data-l="Description">${esc(c.description)}<div class="sub">${esc(catName(p,c.categoryId))}</div></td>
    <td data-l="Impact" class="num money ${c.deltaCents<0?"pos":""}">${fmtSigned(c.deltaCents)}</td>
    <td data-l="Status"><span class="badge b-${c.status}">${c.status}</span></td>
    <td data-l="Actions" class="no-print"><div class="q-actions">
      ${c.status!=="approved"?`<button class="small" onclick="setCOStatus('${c.id}','approved')">Approve</button>`:""}
      ${c.status!=="rejected"?`<button class="small" onclick="setCOStatus('${c.id}','rejected')">Reject</button>`:""}
      ${c.status!=="proposed"?`<button class="small" onclick="setCOStatus('${c.id}','proposed')">Reopen</button>`:""}
      <button class="small icon" onclick="coForm('${c.id}')" title="Edit">✎</button>
      <button class="small icon danger" onclick="deleteCO('${c.id}')" title="Delete">🗑</button>
    </div></td></tr>`).join("");
  const filterBtns=["all","proposed","approved","rejected"].map(f=>
    `<button class="small ${coFilter===f?"primary":""}" onclick="coFilter='${f}';Sound.click();render()">${f[0].toUpperCase()+f.slice(1)}</button>`).join("");
  return `
  <div class="grid3" style="margin-bottom:14px">
    <div class="stat" data-stat="cont-set" role="button" tabindex="0" aria-pressed="false" aria-label="Contingency set — activate for breakdown"><div class="k">Contingency set</div><div class="v money">${fmt(coAlloc)}</div><div class="sub">${p.contingencyPct}% of base budget</div></div>
    <div class="stat" data-stat="co-approved" role="button" tabindex="0" aria-pressed="false" aria-label="Approved change orders — activate for breakdown"><div class="k">Approved change orders</div><div class="v money">${fmt(apprCents)}</div><div class="sub">${appr.length} approved</div></div>
    <div class="stat" data-stat="co-rem" role="button" tabindex="0" aria-pressed="false" aria-label="Contingency remaining — activate for breakdown"><div class="k">Contingency remaining</div><div class="v money ${coRem<0?"v-bad":(coRem<coAlloc*0.25?"v-warn":"v-ok")}">${fmt(coRem)}</div>
      <div class="sub">net approved change orders draw on it</div></div>
  </div>
  <div class="spot-note" id="statDetail" aria-live="polite" hidden></div>
  <div class="card"><div class="toolbar no-print">
      <button class="small primary" onclick="coForm()">+ New change order</button>
      <span class="right"></span><div class="q-actions">${filterBtns}</div></div>
    ${list.length?`<div style="overflow-x:auto"><table class="resp"><thead><tr><th>Date</th><th>Description</th><th class="num">Impact</th><th>Status</th><th class="no-print">Actions</th></tr></thead><tbody>${rows}</tbody></table></div>`
    :`<div class="empty">No change orders${coFilter==="all"?" yet":" with this status"}.</div>`}</div>`;
}

/* ---------- export / import ---------- */
function asStr(v,fb){ return typeof v==="string"?v:(v===null||v===undefined?fb:String(v)); }
function asCents(v){ v=Number(v); return isFinite(v)?Math.round(v):0; }
function asDate(v,fb){ return /^\d{4}-\d{2}-\d{2}$/.test(asStr(v,""))?asStr(v,""):fb; }
function sanitizeState(s){
  const clean={version:1,theme:(s.theme==="dark"||s.theme==="light")?s.theme:null,
    activeProjectId:asStr(s.activeProjectId,null),projects:[]};
  for(const p of s.projects){
    const cp={id:asStr(p.id,uid()),name:asStr(p.name,"Project").slice(0,120),
      createdAt:asCents(p.createdAt)||Date.now(),
      contingencyPct:Math.min(50,Math.max(0,parseInt(p.contingencyPct,10)||0)),
      categories:[],expenses:[],quotes:[],changeOrders:[]};
    const catIds=new Set();
    for(const c of p.categories){
      const cc={id:asStr(c.id,uid()),name:asStr(c.name,"Category").slice(0,80),budgetCents:Math.max(0,asCents(c.budgetCents))};
      if(catIds.has(cc.id)) cc.id=uid();
      catIds.add(cc.id); cp.categories.push(cc);
    }
    if(!cp.categories.length) cp.categories.push({id:uid(),name:"General",budgetCents:0});
    const okCat=id=>catIds.has(id)?id:cp.categories[0].id;
    for(const e of p.expenses) cp.expenses.push({id:asStr(e.id,uid()),date:asDate(e.date,todayStr()),
      categoryId:okCat(e.categoryId),vendor:asStr(e.vendor,"").slice(0,120),
      cents:Math.max(0,asCents(e.cents)),note:asStr(e.note,"").slice(0,500)});
    for(const q of p.quotes){
      const cq={id:asStr(q.id,uid()),jobTitle:asStr(q.jobTitle,"Job").slice(0,120),
        categoryId:okCat(q.categoryId),date:asDate(q.date,todayStr()),bids:[]};
      for(const b of (Array.isArray(q.bids)?q.bids:[]).slice(0,4))
        cq.bids.push({contractor:asStr(b.contractor,"").slice(0,120),cents:Math.max(0,asCents(b.cents)),
          notes:asStr(b.notes,"").slice(0,500),accepted:b.accepted===true});
      // at most one accepted bid survives
      let seen=false;
      for(const b of cq.bids){ if(b.accepted){ if(seen) b.accepted=false; else seen=true; } }
      cp.quotes.push(cq);
    }
    const STATUSES=["proposed","approved","rejected"];
    for(const c of p.changeOrders)
      cp.changeOrders.push({id:asStr(c.id,uid()),description:asStr(c.description,"").slice(0,500),
        categoryId:okCat(c.categoryId),deltaCents:asCents(c.deltaCents),
        date:asDate(c.date,todayStr()),status:STATUSES.includes(c.status)?c.status:"proposed"});
    clean.projects.push(cp);
  }
  if(!clean.projects.some(p=>p.id===clean.activeProjectId))
    clean.activeProjectId=clean.projects[0].id;
  return clean;
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="renotrack-backup-"+todayStr()+".json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const s=JSON.parse(r.result);
      if(!s||typeof s!=="object"||!Array.isArray(s.projects)) throw new Error("bad shape");
      for(const p of s.projects){
        if(typeof p.id!=="string"||typeof p.name!=="string"||!Array.isArray(p.categories)||
           !Array.isArray(p.expenses)||!Array.isArray(p.quotes)||!Array.isArray(p.changeOrders)) throw new Error("bad project");
      }
      dlgConfirm("Import will REPLACE all current data. Continue?",()=>{
        S=sanitizeState(s);
        save(); initTheme(); renderProjectSel(); render(); Sound.success();
      });
    }catch(e){ dlgAlert("That file isn't a valid RenoTrack backup."); Sound.error(); }
  };
  r.readAsText(file);
}

/* ---------- render ---------- */
function render(){
  const p=P();
  if(!p){
    document.getElementById("view").innerHTML=`<div class="card"><div class="empty">No project yet.</div></div>`;
    return;
  }
  catSpotId=null; donutSel=-1; paceSel=-1; /* DOM rebuilt — drop stale spotlight state */
  const el=document.getElementById("view");
  if(activeTab==="dashboard") el.innerHTML=renderDashboard(p);
  else if(activeTab==="budget") el.innerHTML=renderBudget(p);
  else if(activeTab==="quotes") el.innerHTML=renderQuotes(p);
  else if(activeTab==="changes") el.innerHTML=renderChanges(p);
  // live budget inputs
  el.querySelectorAll("input[data-budget]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const c=catById(p,inp.dataset.budget); if(!c) return;
      const v=toCents(inp.value);
      if(v<0){ dlgAlert("Budget can't be negative."); inp.value=(c.budgetCents/100).toFixed(2); return; }
      c.budgetCents=v; save(); render();
    });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); } });
  });
  const coPct=document.getElementById("coPct");
  if(coPct) coPct.addEventListener("change",()=>{
    let v=parseInt(coPct.value,10);
    if(!isFinite(v)||v<0) v=0; if(v>50) v=50;
    p.contingencyPct=v; save(); render();
  });
  /* stat boxes: click/Enter/Space shows the real breakdown */
  el.querySelectorAll(".stat[role=\"button\"]").forEach(st=>{
    st.addEventListener("click",()=>statToggle(st));
    st.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); statToggle(st); } });
  });
  /* clickable category rows (spotlight detail) */
  el.querySelectorAll(".cat-row").forEach(row=>{
    row.addEventListener("click",()=>catSpot(row.dataset.cat));
    row.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); catSpot(row.dataset.cat); } });
  });
  /* recent-expense rows open the editor (clicks on the row's own buttons stay local) */
  el.querySelectorAll(".exp-row").forEach(tr=>{
    tr.addEventListener("click",e=>{ if(e.target&&e.target.closest&&e.target.closest("button")) return; expenseForm(tr.dataset.exp); });
    tr.addEventListener("keydown",e=>{
      if((e.key==="Enter"||e.key===" ")&&!(e.target&&e.target.closest&&e.target.closest("button"))){
        e.preventDefault(); expenseForm(tr.dataset.exp);
      }
    });
  });
  /* donut segment / legend clicks */
  const dw=el.querySelector("#donutWrap");
  if(dw){
    dw.addEventListener("click",e=>{
      const s=e.target&&e.target.closest?e.target.closest("[data-seg]"):null;
      if(s) donutSpot(parseInt(s.dataset.seg,10));
    });
    dw.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){
        const s=e.target&&e.target.closest?e.target.closest("[data-seg]"):null;
        if(s){ e.preventDefault(); donutSpot(parseInt(s.dataset.seg,10)); }
      }
    });
  }
  /* pace-sparkline clicks + arrow-key stepping */
  const pw=el.querySelector("#paceWrap");
  if(pw){
    pw.addEventListener("click",e=>{
      const d=e.target&&e.target.closest?e.target.closest(".pace-dot"):null;
      if(d) paceSelFn(parseInt(d.dataset.i,10));
    });
    pw.addEventListener("keydown",e=>{
      if(e.target&&e.target.classList&&e.target.classList.contains("pace-dot")&&(e.key==="Enter"||e.key===" ")){
        e.preventDefault(); paceSelFn(parseInt(e.target.dataset.i,10)); return;
      }
      if((e.key==="ArrowRight"||e.key==="ArrowLeft")&&pacePtsArr.length){
        e.preventDefault();
        let i=paceSel<0?(e.key==="ArrowRight"?0:pacePtsArr.length-1):paceSel+(e.key==="ArrowRight"?1:-1);
        paceSelFn(Math.max(0,Math.min(pacePtsArr.length-1,i)));
      }
    });
  }
}

/* ---------- init ---------- */
function init(){
  S=load();
  if(!S){ S=blankState(); S.projects.push(blankProject("Project 1")); S.activeProjectId=S.projects[0].id; save(); }
  else if(!S.projects.length){ S.projects.push(blankProject("Project 1")); S.activeProjectId=S.projects[0].id; save(); }
  else if(!P()){ S.activeProjectId=S.projects[0].id; save(); }
  initTheme();
  document.getElementById("themeToggle").onclick=()=>{
    const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
    applyTheme(t); Sound.toggleTheme(); Sound.click();
  };
  document.getElementById("exportBtn").onclick=()=>{ exportData(); Sound.success(); };
  document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
  document.getElementById("importFile").addEventListener("change",e=>{
    if(e.target.files[0]) importData(e.target.files[0]);
    e.target.value="";
  });
  document.getElementById("newProjBtn").onclick=newProject;
  document.getElementById("renameProjBtn").onclick=renameProject;
  document.getElementById("delProjBtn").onclick=deleteProject;
  /* tap-to-edit: quote cards, bid cards, change-order rows (inner action buttons stay isolated) */
  document.addEventListener("click",e=>{
    const bid=e.target.closest?e.target.closest(".bid-card"):null;
    if(bid){ if(e.target.closest("button"))return; bidForm(bid.dataset.qid,+bid.dataset.i); Sound.click(); return; }
    const qc=e.target.closest?e.target.closest(".quote-card"):null;
    if(qc){ if(e.target.closest("button"))return; quoteForm(qc.dataset.qid); Sound.click(); return; }
    const cor=e.target.closest?e.target.closest("tr.co-row"):null;
    if(cor){ if(e.target.closest("button"))return; coForm(cor.dataset.co); Sound.click(); return; }
  });
  document.addEventListener("keydown",e=>{
    if(e.key!=="Enter"&&e.key!==" ")return;
    const t=e.target.closest?e.target.closest(".bid-card,.quote-card,tr.co-row"):null;
    if(!t)return;
    e.preventDefault();
    if(t.classList.contains("bid-card")) bidForm(t.dataset.qid,+t.dataset.i);
    else if(t.classList.contains("quote-card")) quoteForm(t.dataset.qid);
    else coForm(t.dataset.co);
    Sound.click();
  });
  /* Escape releases every spotlight back to the default view */
  document.addEventListener("keydown",e=>{
    if(e.key!=="Escape") return;
    const card=document.getElementById("statDetail");
    if(card&&!card.hidden){
      card.hidden=true; card.innerHTML="";
      document.querySelectorAll(".stat[role=\"button\"]").forEach(s=>s.setAttribute("aria-pressed","false"));
      Sound.click();
    }
    if(donutSel>=0) donutSpot(donutSel);     /* toggle releases */
    if(paceSel>=0) paceSelFn(paceSel);         /* back to latest-cumulative view */
    if(catSpotId) catSpot(catSpotId);          /* toggle releases */
  });
  renderProjectSel(); renderTabs(); render();
  paintSample();
  const sb=document.getElementById("soundToggle"); if(sb) paintSoundBtn(sb);
}
document.addEventListener("DOMContentLoaded",init);
