<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Moving Cost Calculator — Estimate Your Move | Glenerds</title>
<meta name="description" content="Free moving cost calculator: estimate DIY, container, and full-service move costs by home size and distance. Offline, no account.">
<link rel="canonical" href="https://glenerds.github.io/glenerds/tools/moving-cost-calculator/">
<meta name="robots" content="noindex">
<script>
(function(){try{var t=localStorage.getItem('glenerds-theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
<link rel="stylesheet" href="../../style.css">
<style>
.embed-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.7rem .25rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
.embed-head strong{font-size:1.05rem}
.embed-head .theme-toggle{margin-left:0;padding:.25rem .55rem;font-size:.78rem}
.wrap{max-width:720px}
.toolbox{margin:0 0 1rem}
.attrib{text-align:center;margin:1rem 0 1.5rem}
</style>
</head>
<body>
<div class="wrap">
<div class="embed-head"><strong>Moving Cost Calculator</strong><span><a href="https://glenerds.gumroad.com" style="font-size:.85rem;font-weight:600;margin-right:.6rem">Store</a><button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">◐</button></span></div>
<div class="toolbox" role="region" aria-label="Moving cost calculator">

<label>Home size:
<select id="mv-size" aria-label="Home size">
<option value="0">Studio</option><option value="1" selected>1 bedroom</option>
<option value="2">2 bedrooms</option><option value="3">3 bedrooms</option>
<option value="4">4 bedrooms</option><option value="5">5+ bedrooms</option>
</select></label>
<label>Distance (miles): <input type="number" id="mv-miles" value="500" min="0" step="10" style="width:6rem" aria-label="Distance in miles"></label>
<label>Move type:
<select id="mv-type" aria-label="Move type">
<option value="diy">DIY rental truck</option>
<option value="container">Portable container</option>
<option value="full" selected>Full-service movers</option>
</select></label><br>
<label><input type="checkbox" id="mv-pack"> Packing service</label>
<label><input type="checkbox" id="mv-store"> 1 month storage</label>
<label><input type="checkbox" id="mv-val"> Full valuation coverage</label><br>
<button id="mv-go">Estimate my move</button>
<div id="mv-out" style="margin-top:1rem"></div>
<p class="small">Estimates use national-average ballparks so you can sanity-check quotes &mdash; your actual quotes are what matter.</p>
</div>
<p class="small attrib">Powered by <a href="https://glenerds.github.io/glenerds/tools/moving-cost-calculator/" target="_blank" rel="noopener">Glenerds</a> &mdash; <a href="https://glenerds.github.io/glenerds/tools/moving-cost-calculator/" target="_blank" rel="noopener">open the full free tool</a> &mdash; <a href="https://glenerds.gumroad.com/l/moving-company-quote-comparison-scam-checker" target="_blank" rel="noopener">Want the full offline version? Get MoveAudit &mdash; $9 one-time</a> &mdash; <a href="../../site-map/index.html">Site map</a></p>
</div>
<script>
(function(){
  var KEY='glenerds-movecost-v1';
  var BASE={diy:[180,260,340,430,520,620],container:[1400,1900,2500,3200,3900,4600],full:[900,1300,2100,3300,4700,6100]};
  var PERMILE={diy:0.89,container:1.60,full:2.75};
  function money(n){return '$'+Math.round(n).toLocaleString('en-US');}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
  function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
  function calc(){
    var size=parseInt(document.getElementById('mv-size').value,10);
    var miles=Math.max(0,parseFloat(document.getElementById('mv-miles').value)||0);
    var type=document.getElementById('mv-type').value;
    var pack=document.getElementById('mv-pack').checked;
    var store=document.getElementById('mv-store').checked;
    var val=document.getElementById('mv-val').checked;
    var base=BASE[type][size],mile=PERMILE[type]*miles;
    var extras=0,lines=[];
    lines.push(['Base '+typeLabel(type),base]);
    if(miles>0){lines.push(['Distance ('+miles.toLocaleString()+' mi)',mile]);}
    if(pack){var p=base*0.25;extras+=p;lines.push(['Packing service',p]);}
    if(store){extras+=160;lines.push(['Storage (1 month)',160]);}
    if(val){extras+=120;lines.push(['Valuation coverage',120]);}
    var mid=base+mile+extras,low=mid*0.85,high=mid*1.3;
    var html='<p style="font-size:1.2rem"><strong>Estimated range: '+money(low)+' &ndash; '+money(high)+'</strong></p><table><tbody>';
    lines.forEach(function(l){html+='<tr><td>'+l[0]+'</td><td>'+money(l[1])+'</td></tr>';});
    html+='</tbody></table>';
    document.getElementById('mv-out').innerHTML=html;
    save({size:size,miles:miles,type:type,pack:pack,store:store,val:val});
  }
  function typeLabel(t){return t==='diy'?'truck rental':t==='container'?'container':'movers';}
  var d=load();
  if(d){document.getElementById('mv-size').value=d.size;document.getElementById('mv-miles').value=d.miles;
    document.getElementById('mv-type').value=d.type;document.getElementById('mv-pack').checked=!!d.pack;
    document.getElementById('mv-store').checked=!!d.store;document.getElementById('mv-val').checked=!!d.val;}
  document.getElementById('mv-go').onclick=calc;
  ['mv-size','mv-miles','mv-type','mv-pack','mv-store','mv-val'].forEach(function(id){
    document.getElementById(id).addEventListener('change',calc);});
  calc();
})();
</script>
<script>
(function(){
  var KEY='glenerds-theme',root=document.documentElement,btn=document.getElementById('theme-toggle');
  function sysDark(){return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;}
  function cur(){try{var s=localStorage.getItem(KEY);if(s==='dark'||s==='light')return s;}catch(e){}return sysDark()?'dark':'light';}
  function paint(){var t=cur();root.setAttribute('data-theme',t);
    if(btn){btn.textContent=(t==='dark'?'\u2600 Light':'\u25D0 Dark');btn.setAttribute('aria-pressed',t==='dark'?'true':'false');}}
  if(btn){btn.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark';try{localStorage.setItem(KEY,n);}catch(e){}paint();});}
  paint();
})();
</script>
</body>
</html>
