<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free HOA Special Assessment Calculator | Glenerds</title>
<meta name="description" content="Free HOA special assessment calculator: estimate your share of a special assessment from project cost, units, and reserves. Offline, no account.">
<link rel="canonical" href="https://glenerds.github.io/glenerds/tools/hoa-special-assessment-calculator/">
<meta name="robots" content="noindex">
<script>
(function(){try{var t=localStorage.getItem('glenerds-theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
<link rel="stylesheet" href="../../style.css">
<style>
.embed-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.7rem .25rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
.embed-head strong{font-size:1.05rem}
.embed-head .theme-toggle{margin-left:0;padding:.25rem .55rem;font-size:.78rem}
.wrap{max-width:720px}
.toolbox{margin:0 0 1rem}
.attrib{text-align:center;margin:1rem 0 1.5rem}
</style>
</head>
<body>
<div class="wrap">
<div class="embed-head"><strong>HOA Special Assessment Calculator</strong><span><a href="https://glenerds.gumroad.com" style="font-size:.85rem;font-weight:600;margin-right:.6rem">Store</a><button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">◐</button></span></div>
<div class="toolbox" role="region" aria-label="HOA special assessment calculator">

<label>Total project cost: $<input type="number" id="ha-cost" value="250000" min="0" step="1000" style="width:8rem" aria-label="Total project cost"></label>
<label>Number of units: <input type="number" id="ha-units" value="40" min="1" step="1" style="width:5rem" aria-label="Number of units"></label><br>
<label>Your share: <select id="ha-share" aria-label="Share method"><option value="equal">Equal split per unit</option><option value="pct">My ownership %</option></select></label>
<label id="ha-pctwrap" style="display:none">Ownership %: <input type="number" id="ha-pct" value="2.5" min="0" max="100" step="0.1" style="width:5rem" aria-label="Ownership percent"></label><br>
<label>Reserve funds available: $<input type="number" id="ha-res" value="60000" min="0" step="1000" style="width:8rem" aria-label="Reserve funds"></label>
<label>Your monthly dues: $<input type="number" id="ha-dues" value="350" min="0" step="10" style="width:6rem" aria-label="Monthly dues"></label><br>
<button id="ha-go">Calculate my share</button>
<div id="ha-out" style="margin-top:1rem"></div>
<p class="small">A planning estimate only &mdash; your HOA&rsquo;s governing documents control how assessments are actually allocated.</p>
</div>
<p class="small attrib">Powered by <a href="https://glenerds.github.io/glenerds/tools/hoa-special-assessment-calculator/" target="_blank" rel="noopener">Glenerds</a> &mdash; <a href="https://glenerds.github.io/glenerds/tools/hoa-special-assessment-calculator/" target="_blank" rel="noopener">open the full free tool</a> &mdash; <a href="https://glenerds.gumroad.com/l/hoa-resale-package-reserve-study-risk-analyzer" target="_blank" rel="noopener">Want the full offline version? Get HOA ReserveCheck &mdash; $9 one-time</a> &mdash; <a href="../../site-map/index.html">Site map</a></p>
</div>
<script>
(function(){
  var KEY='glenerds-hoaassess-v1';
  function money(n){return '$'+Math.round(n).toLocaleString('en-US');}
  function gv(id){return parseFloat(document.getElementById(id).value)||0;}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
  function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
  function calc(){
    var cost=gv('ha-cost'),units=Math.max(1,gv('ha-units')),res=gv('ha-res'),dues=gv('ha-dues');
    var method=document.getElementById('ha-share').value;
    var share=method==='equal'?1/units:gv('ha-pct')/100;
    var gross=cost*share,resShare=res*share,net=Math.max(0,gross-resShare);
    var months=dues>0?net/dues:0;
    var fundPct=cost>0?res/cost*100:0;
    var html='<p style="font-size:1.2rem"><strong>Your estimated share: '+money(net)+'</strong></p>'
      +'<table><tbody>'
      +'<tr><td>Gross share of project</td><td>'+money(gross)+'</td></tr>'
      +'<tr><td>Less your share of reserves</td><td>&minus;'+money(resShare)+'</td></tr>'
      +'<tr><td><strong>Out of pocket</strong></td><td><strong>'+money(net)+'</strong></td></tr>'
      +'<tr><td>Equals months of dues</td><td>'+months.toFixed(1)+'</td></tr>'
      +'<tr><td>Reserves cover</td><td>'+fundPct.toFixed(0)+'% of project</td></tr>'
      +'</tbody></table>';
    if(fundPct<30){html+='<p><strong>⚠ Thin reserves.</strong> Under a third of the project covered by reserves is exactly when large assessments happen.</p>';}
    document.getElementById('ha-out').innerHTML=html;
    save({cost:cost,units:units,res:res,dues:dues,method:method,pct:gv('ha-pct')});
  }
  var d=load();
  if(d){document.getElementById('ha-cost').value=d.cost;document.getElementById('ha-units').value=d.units;
    document.getElementById('ha-res').value=d.res;document.getElementById('ha-dues').value=d.dues;
    document.getElementById('ha-share').value=d.method;document.getElementById('ha-pct').value=d.pct;}
  function syncPct(){document.getElementById('ha-pctwrap').style.display=
    document.getElementById('ha-share').value==='pct'?'inline':'none';}
  document.getElementById('ha-share').addEventListener('change',function(){syncPct();calc();});
  ['ha-cost','ha-units','ha-res','ha-dues','ha-pct'].forEach(function(id){
    document.getElementById(id).addEventListener('input',calc);});
  document.getElementById('ha-go').onclick=calc;
  syncPct();calc();
})();
</script>
<script>
(function(){
  var KEY='glenerds-theme',root=document.documentElement,btn=document.getElementById('theme-toggle');
  function sysDark(){return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;}
  function cur(){try{var s=localStorage.getItem(KEY);if(s==='dark'||s==='light')return s;}catch(e){}return sysDark()?'dark':'light';}
  function paint(){var t=cur();root.setAttribute('data-theme',t);
    if(btn){btn.textContent=(t==='dark'?'\u2600 Light':'\u25D0 Dark');btn.setAttribute('aria-pressed',t==='dark'?'true':'false');}}
  if(btn){btn.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark';try{localStorage.setItem(KEY,n);}catch(e){}paint();});}
  paint();
})();
</script>
</body>
</html>
