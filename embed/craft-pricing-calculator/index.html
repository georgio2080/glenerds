<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Craft Pricing Calculator for Handmade Sellers | Glenerds</title>
<meta name="description" content="Free craft pricing calculator: enter materials, labor, and fees to get a suggested handmade product price with a profit verdict. Offline, no account.">
<link rel="canonical" href="https://glenerds.netlify.app/tools/craft-pricing-calculator/">
<meta name="robots" content="noindex">
<script>
(function(){try{var t=localStorage.getItem('glenerds-theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
<link rel="stylesheet" href="../../style.css">
<style>
.embed-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.7rem .25rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
.embed-head strong{font-size:1.05rem}
.embed-head .theme-toggle{margin-left:0;padding:.25rem .55rem;font-size:.78rem}
.wrap{max-width:720px}
.toolbox{margin:0 0 1rem}
.attrib{text-align:center;margin:1rem 0 1.5rem}
</style>
</head>
<body>
<div class="wrap">
<div class="embed-head"><strong>Craft Pricing Calculator</strong><span><a href="https://glenerds.gumroad.com" style="font-size:.85rem;font-weight:600;margin-right:.6rem">Store</a><button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">◐</button></span></div>
<div class="toolbox" role="region" aria-label="Craft pricing calculator">

<label>Materials cost per item: $<input type="number" id="cp-mat" value="4.50" min="0" step="0.01" style="width:6rem" aria-label="Materials cost"></label>
<label>Labor hours per item: <input type="number" id="cp-hrs" value="0.5" min="0" step="0.1" style="width:5rem" aria-label="Labor hours"></label>
<label>Your hourly rate: $<input type="number" id="cp-rate" value="20" min="0" step="0.5" style="width:5rem" aria-label="Hourly rate"></label><br>
<label>Overhead per item: $<input type="number" id="cp-oh" value="1" min="0" step="0.1" style="width:5rem" aria-label="Overhead per item"></label>
<label>Marketplace fee %: <input type="number" id="cp-fee" value="10" min="0" max="50" step="0.5" style="width:5rem" aria-label="Marketplace fee percent"></label>
<label>Target profit margin %: <input type="number" id="cp-margin" value="30" min="0" max="90" step="1" style="width:5rem" aria-label="Target profit margin percent"></label><br>
<label>Your current price (optional): $<input type="number" id="cp-cur" value="0" min="0" step="0.01" style="width:6rem" aria-label="Current selling price"></label>
<button id="cp-go">Calculate price</button>
<div id="cp-out" style="margin-top:1rem"></div>
<p class="small">Fee default of 10% approximates a typical marketplace cut &mdash; adjust it to your actual channel.</p>
</div>
<p class="small attrib">Powered by <a href="https://glenerds.netlify.app/tools/craft-pricing-calculator/" target="_blank" rel="noopener">Glenerds</a> &mdash; <a href="https://glenerds.netlify.app/tools/craft-pricing-calculator/" target="_blank" rel="noopener">open the full free tool</a> &mdash; <a href="https://glenerds.gumroad.com/l/handmade-pricing-calculator-etsy-craft-sellers" target="_blank" rel="noopener">Want the full offline version? Get CraftCost &mdash; $14 one-time</a> &mdash; <a href="../../site-map/index.html">Site map</a></p>
</div>
<script>
(function(){
  var KEY='glenerds-craftprice-v1';
  function money(n){return '$'+n.toFixed(2);}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({
    mat:gv('cp-mat'),hrs:gv('cp-hrs'),rate:gv('cp-rate'),oh:gv('cp-oh'),fee:gv('cp-fee'),margin:gv('cp-margin'),cur:gv('cp-cur')}))}catch(e){}}
  function gv(id){return parseFloat(document.getElementById(id).value)||0;}
  function verdict(margin){
    if(margin>=30)return['Healthy','Your margin leaves real room for growth, discounts, and surprises.'];
    if(margin>=15)return['Thin','You are covering costs but one bad batch or fee hike eats the profit.'];
    return['Underwater','This price loses money on every sale once fees and labor are counted.'];}
  function calc(){
    var mat=gv('cp-mat'),hrs=gv('cp-hrs'),rate=gv('cp-rate'),oh=gv('cp-oh');
    var fee=gv('cp-fee')/100,margin=gv('cp-margin')/100,cur=gv('cp-cur');
    var labor=hrs*rate,cost=mat+labor+oh;
    var denom=1-fee-margin,price=denom>0?cost/denom:0;
    var html='<p style="font-size:1.2rem"><strong>Suggested price: '+money(price)+'</strong></p>';
    html+='<table><tbody><tr><td>Materials</td><td>'+money(mat)+'</td></tr>'
      +'<tr><td>Labor ('+hrs+'h @ '+money(rate)+'/h)</td><td>'+money(labor)+'</td></tr>'
      +'<tr><td>Overhead</td><td>'+money(oh)+'</td></tr>'
      +'<tr><td><strong>True cost per item</strong></td><td><strong>'+money(cost)+'</strong></td></tr>'
      +'<tr><td>Marketplace fees ('+(fee*100).toFixed(1)+'%)</td><td>'+money(price*fee)+'</td></tr>'
      +'<tr><td>Your profit ('+(margin*100).toFixed(0)+'%)</td><td>'+money(price*margin)+'</td></tr></tbody></table>';
    if(cur>0){
      var actualMargin=(cur-cost-cur*fee)/cur*100;
      var v=verdict(actualMargin);
      html+='<p><strong>Your current price of '+money(cur)+': '+v[0]+'</strong> ('+actualMargin.toFixed(1)+'% margin)<br><span class="small">'+v[1]+'</span></p>';
    }
    document.getElementById('cp-out').innerHTML=html;save();
  }
  var d=load();
  if(d){['mat','hrs','rate','oh','fee','margin','cur'].forEach(function(k,i){
    var ids=['cp-mat','cp-hrs','cp-rate','cp-oh','cp-fee','cp-margin','cp-cur'];
    if(d[k]!==undefined)document.getElementById(ids[i]).value=d[k];});}
  document.getElementById('cp-go').onclick=calc;
  ['cp-mat','cp-hrs','cp-rate','cp-oh','cp-fee','cp-margin','cp-cur'].forEach(function(id){
    document.getElementById(id).addEventListener('input',calc);});
  calc();
})();
</script>
<script>
(function(){
  var KEY='glenerds-theme',root=document.documentElement,btn=document.getElementById('theme-toggle');
  function sysDark(){return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;}
  function cur(){try{var s=localStorage.getItem(KEY);if(s==='dark'||s==='light')return s;}catch(e){}return sysDark()?'dark':'light';}
  function paint(){var t=cur();root.setAttribute('data-theme',t);
    if(btn){btn.textContent=(t==='dark'?'\u2600 Light':'\u25D0 Dark');btn.setAttribute('aria-pressed',t==='dark'?'true':'false');}}
  if(btn){btn.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark';try{localStorage.setItem(KEY,n);}catch(e){}paint();});}
  paint();
})();
</script>
</body>
</html>
